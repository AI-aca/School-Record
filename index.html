<style>
:root{color-scheme:light;--bg:#f3f6f8;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#e2e8f0;--pri:#00a886;--pri-d:#008f72;--pri2:#e6f7f2;--pri-t:#047857;--ok:#10b981;--warn:#d97706;--bad:#dc2626;--side:#fff;--shadow:0 1px 3px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.05)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:14px;line-height:1.5;display:flex}
#side{width:248px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;flex-shrink:0;position:sticky;top:0;height:100vh}
.logo{padding:0 4px 18px}.slogo{display:block;width:100%;max-width:210px;height:auto;margin:0 0 12px}.lt{line-height:1.3}
.logo b{display:block;font-size:19px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#0891b2,#059669);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo span{font-size:12px;color:var(--sub)}
.reg{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,#06b6d4,#10b981);box-shadow:0 4px 12px rgba(6,182,212,.25);margin-bottom:18px}
.reg:hover{filter:brightness(.95)}
.menu{display:flex;flex-direction:column;gap:4px}
.menu a{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;color:var(--sub);text-decoration:none;font-weight:500;cursor:pointer}
.menu a:hover{background:#f1f5f9;color:var(--ink)}
.menu a.on{background:var(--pri2);color:var(--pri-t);font-weight:700;box-shadow:inset 3px 0 0 var(--pri)}
.menu svg,.reg svg{width:18px;height:18px;flex-shrink:0}
.prof{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#06b6d4,#10b981);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.who b{display:block;font-size:14px}.who span{font-size:12px;color:var(--sub)}
#main{flex:1;min-width:0;padding:26px 36px 48px;overflow-x:hidden}
body.out #side{display:none}
body.out #main{max-width:520px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h2{font-size:26px;font-weight:800;margin:0;letter-spacing:-.5px}
.ph p{margin:4px 0 0;color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
h2.t{font-size:16px;margin:0 0 12px}
h2{font-size:17px;margin:0 0 12px}
input,select,textarea{color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--ink);width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(0,168,134,.15)}
.pwm{-webkit-text-security:disc;text-security:disc}
label{font-size:13px;color:var(--sub);display:block;margin:12px 0 5px;font-weight:500}
button{font:inherit;border:0;border-radius:9px;padding:9px 16px;background:var(--pri);color:#fff;cursor:pointer;font-weight:600}
button:hover{background:var(--pri-d)}
button.ghost{background:var(--pri2);color:var(--pri-t)}
button.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
button.line:hover{background:#f1f5f9}
button:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--sub);font-size:13px}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--pri))}
.stat span{font-size:12px;color:var(--sub);font-weight:600}.stat b{display:block;font-size:28px;font-weight:800;margin-top:2px}
.bar2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar2 .sr{position:relative;flex:1;min-width:200px;max-width:340px}
.bar2 .sr input{padding-left:36px}
.bar2 .sr svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--sub)}
.bar2 select{width:auto}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{background:#f8fafc;color:var(--sub);font-weight:700;font-size:12px;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover{background:#f8fffd}
.chip{display:inline-block;background:var(--pri2);color:var(--pri-t);font-weight:700;padding:3px 11px;border-radius:7px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#eef2ff;color:#4338ca;white-space:nowrap}
.pill.pass{background:#dcfce7;color:#15803d}.pill.warn{background:#fef3c7;color:#b45309}.pill.fail{background:#fee2e2;color:#b91c1c}.pill.none{background:#f1f5f9;color:#64748b}
.sc{font-weight:800;font-size:15px}
.btn-s{display:inline-block;padding:6px 14px;border-radius:99px;background:var(--pri);color:#fff;font-weight:600;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fafcfc}
.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--sub)}
.bar{height:12px;background:#e8eef3;border-radius:6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#06b6d4,#10b981)}
.bar i.r{position:absolute;top:0;background:#bfeadf;background-image:none}
.cells{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:11px}
.cell b{font-size:13px}
.cell.done{background:#ecfdf3}.cell.improvable{background:#fff8eb}.cell.pending{background:#eef2ff}.cell.penalized{background:#fef2f2}
.gate{border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin:12px 0}
.gate.pass{border-color:#16a34a;background:#f0fdf4}.gate.warn{border-color:#d97706;background:#fffbeb}.gate.fail{border-color:#dc2626;background:#fef2f2}
.gate b.t{font-size:15px}
.hidden{display:none!important}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #cbd5e1;border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.page{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:16px;box-shadow:var(--shadow)}
.page h3{margin:16px 0 8px;font-size:15px}
ul.tight{margin:4px 0 0;padding-left:18px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs a{padding:8px 16px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--sub);text-decoration:none;font-weight:600;cursor:pointer}
.tabs a.on{background:var(--pri);border-color:var(--pri);color:#fff}
a{color:var(--pri-t)}

.note{background:#f0fdf9;border:1px solid #bdeedd;color:#065f46;border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:3px solid var(--pri);padding-bottom:12px;margin-bottom:18px}
.rh-c{text-align:left;font-size:22px;font-weight:800;letter-spacing:-.5px;white-space:nowrap}
.rh-l{display:flex;align-items:center;gap:14px}.rh-l b{display:block;font-size:18px;letter-spacing:-.3px}.rh-l span{font-size:13px;color:var(--sub)}
.rlogo{height:40px;width:auto;display:block}
.rh-r{font-size:13px;color:var(--sub);text-align:right;line-height:1.55}
.rs{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:2px 0 14px}.rs h2{font-size:30px;margin:0;padding:3px 20px;border:3px solid var(--pri);border-radius:14px;background:#f0fdf9;letter-spacing:-.5px}.rs .meta{display:flex;gap:8px;flex-wrap:wrap;margin:0}
.sub{display:flex;align-items:center;background:#f1f5f9;border-radius:9px;padding:7px 13px;margin:16px 0 10px;font-size:15.5px;font-weight:700;color:#334155}.sub::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--pri);margin-right:9px}.sub span,.sub small{margin-left:auto;color:var(--sub);font-weight:600;font-size:14px}
.gh{font-size:17px;font-weight:800;margin:22px 0 10px;padding:9px 16px;border-radius:10px;background:var(--c);color:#fff}
.gd h2{font-size:17px;margin:0 0 10px}.gl{list-style:none;margin:0;padding:0}.gl li{position:relative;padding:5px 0 5px 24px;font-size:14.5px;line-height:1.7}.gl li::before{content:"✓";position:absolute;left:2px;color:var(--pri-t);font-weight:800}.gl code{background:#f1f5f9;border-radius:6px;padding:1px 7px;font-size:13px}
.gwarn{margin-top:10px;background:#fff8eb;border:1px solid #fcd34d;color:#92400e;border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.6}
.admwarn{background:#fef2f2;border:2px solid #fca5a5;color:#b91c1c;font-weight:800;border-radius:10px;padding:8px 14px;margin-bottom:10px;text-align:center}
.rs .pill{font-size:13.5px;padding:4px 12px}
.sec{font-size:18px;font-weight:800;margin:24px 0 10px;padding-left:11px;border-left:5px solid var(--pri);letter-spacing:-.3px}
.sec small{font-size:13px;color:var(--sub);font-weight:500;margin-left:8px}
.gate{font-size:15px;line-height:1.6}.gate b.t{font-size:17px}
.hero{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center;border:1px solid #a7f3d0;background:linear-gradient(135deg,#ecfeff,#ecfdf5);border-radius:16px;padding:16px 24px}
.ring{position:relative;width:188px;height:188px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.ring .c b{font-size:46px;font-weight:800}.ring .c span{font-size:14px;color:var(--sub)}
.hs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hs>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.hs span{display:block;font-size:13.5px;color:var(--sub)}.hs b{display:block;font-size:24px;margin-top:2px;line-height:1.25}
.hs b.sm{font-size:18px;margin-top:4px}.hs em.hn{display:block;font-style:normal;font-size:12.5px;color:var(--sub);margin-top:2px}
.ar{margin:14px 0 16px}.ar-h{display:flex;justify-content:space-between;align-items:baseline}.ar-h b{font-size:17px}
.ar-n{font-size:14px;color:var(--sub)}.ar-n em{font-style:normal;font-size:28px;font-weight:800;color:var(--ink)}
.trk{position:relative;height:20px;border-radius:10px;background:#e8eef3;overflow:hidden;margin:6px 0}
.trk i{position:absolute;top:0;bottom:0}.trk i.a{left:0;background:linear-gradient(90deg,#06b6d4,#10b981);border-radius:10px 0 0 10px}
.trk i.b{background:repeating-linear-gradient(135deg,#a7e8d3 0 4px,#d1f4e7 4px 8px)}
.ar.tot .trk{height:24px;border-radius:12px}
.ar-f{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.lg2{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin:4px 0 12px}
.lg2 i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-2px;border:1px solid #cbd5e1}
.grp .sub{margin:18px 0 10px}
.cells{display:grid;grid-template-columns:repeat(3,1fr)!important;gap:10px!important}
.cell{padding:10px 12px!important;font-size:13.5px!important;border-radius:11px!important;position:relative;border:1px solid var(--line)}
.cell .cn{font-size:12px;color:var(--sub)}.cell .ct{font-weight:600;line-height:1.35;min-height:36px;font-size:14px}
.cell .cv b{font-size:21px}.cell .cv span{color:var(--sub);font-size:13px;margin-left:4px}
.cell .mb{height:5px;border-radius:3px;background:rgba(15,23,42,.08);margin-top:6px;overflow:hidden}.cell .mb i{display:block;height:100%;background:#10b981}
.cell.done{background:#ecfdf3}.cell.improvable{background:#fff8eb}.cell.pending{background:#eef2ff}.cell.penalized{background:#fef2f2}
.cell.safe,.cell.locked{background:#f8fafc}
.page table{font-size:14.5px}.page th{font-size:13px}.page th,.page td{padding:10px 12px}
.pf{display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;border-top:1px solid var(--line);margin-top:22px;padding-top:8px}
.sum{background:linear-gradient(135deg,#ecfeff,#ecfdf5);border:1px solid #a7f3d0;border-radius:14px;padding:14px 18px;font-size:15px;line-height:1.65}
.adv{border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0;background:#fcfffe;font-size:14.5px;line-height:1.6}
.adv b{font-size:15.5px;margin-bottom:3px}.adv .w{display:inline-block;font-size:12.5px;color:var(--pri-t);background:var(--pri2);border-radius:8px;padding:2px 10px;white-space:nowrap;flex-shrink:0}.adv .ex{margin-top:6px;font-size:13.5px;color:var(--sub)}
.rt{border:1px solid var(--line);border-radius:16px;padding:14px 18px 8px;margin:14px 0;background:#fff;break-inside:avoid}
.rt-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}.rt-h .pill{font-size:15px;padding:5px 14px;background:var(--pri);color:#fff}
.rt-h span.f{font-size:15px;font-weight:700;color:var(--ink)}
.ac{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:11px 0;border-top:1px dashed var(--line);break-inside:avoid}
.ac .n{width:26px;height:26px;border-radius:50%;background:var(--pri2);color:var(--pri-t);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13.5px}
.ac b{display:block;font-size:15.5px;line-height:1.45}.ac .h{font-size:14.5px;line-height:1.6;margin-top:2px}
.ar2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.ar2 b{flex:1}
.ac .w{display:inline-block;flex-shrink:0;margin-top:1px;font-size:12.5px;color:var(--pri-t);background:var(--pri2);border-radius:8px;padding:2px 10px;white-space:nowrap}
.wn{padding-left:20px;margin:6px 0 0;font-size:14.5px;line-height:1.65}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width:900px){body{display:block}#side{position:static;width:auto;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:12px}.logo{padding:0}.menu{flex-direction:row}.prof{margin:0;border:0;padding:0;flex-direction:row;align-items:center;margin-left:auto}.reg{width:auto;margin:0;padding:9px 14px}#main{padding:18px 14px}.stats,.kpis{grid-template-columns:1fr 1fr}.cells{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:9mm}
  body{background:#fff;display:block}
  #side,.noprint{display:none!important}
  #main{padding:0}
  .page{border:0;border-radius:0;padding:0;margin:0;box-shadow:none;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto}

  .rlogo{height:34px}.rh{padding-bottom:8px;margin-bottom:12px}.rs{margin:0 0 8px}.rs h2{font-size:24px;padding:2px 16px}.sub{margin:10px 0 6px;padding:5px 12px}
  .sec{margin:14px 0 7px;font-size:17px}
  .gate{padding:7px 14px;margin:6px 0;font-size:14px;line-height:1.5}
  .ring{width:150px;height:150px}.hero{grid-template-columns:160px 1fr;padding:10px 16px;gap:16px}.ring .c b{font-size:36px}.hs b{font-size:21px}.hs>div{padding:8px 12px}
  .ar{margin:8px 0 9px}.ar-n em{font-size:24px}.trk{height:16px}.ar.tot .trk{height:20px}

  .grp .sub{margin:9px 0 6px}.cells{gap:6px!important}
  .cell{padding:5px 10px!important}.cell .ct{min-height:0;font-size:13.5px}.cell .cv b{font-size:19px}.cell .mb{height:4px;margin-top:4px}

let token = sessionStorage.getItem('sr_token') || '', role = sessionStorage.getItem('sr_role') || '';

async function api(action, body = {}) {
  const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json', 'x-app-token': token }, body: JSON.stringify({ action, ...body }) });
  const j = await r.json().catch(() => ({ error: '서버 응답을 읽지 못했습니다.' }));
  if (r.status === 401 && token) { logout(); }
  if (!r.ok) throw new Error(j.error || '오류 ' + r.status);
  return j;
}
function logout() { token = ''; role = ''; sessionStorage.clear(); route(); }
$('#logout').onclick = logout;
const head = (t, sub, right = '') => `<div class="ph"><div><h2>${t}</h2><p>${sub || ''}</p></div><div>${right}</div></div>`;

// ── 화면 전환 ──
async function route() {
  document.body.classList.toggle('out', !token);
  $('#who').textContent = role === 'director' ? '관리자' : role ? '강사' : '';
  $('#av').textContent = role === 'director' ? '관' : '강';
  $('#m-set').classList.toggle('hidden', !(token && role === 'director'));
  if (!token) return viewLogin();
  const h = location.hash;
  $('#m-home').classList.toggle('on', !h.startsWith('#/settings') && h !== '#/new' && h !== '#/guide');
  $('#m-guide').classList.toggle('on', h === '#/guide');
  $('#m-set').classList.toggle('on', h === '#/settings');
  if (h === '#/new') return viewNew();
  if (h === '#/guide') return viewGuide();
  if (h === '#/settings') return role === 'director' ? viewSettings() : viewList();
  if (h.startsWith('#/student/')) return viewStudent(h.split('/')[2]);
  if (h.startsWith('#/result/')) return viewResult(h.split('/')[2], h.split('/')[3] === 'admin' && role === 'director');
  return viewList();
}
$('#regbtn').onclick = () => (location.hash = '#/new');
window.onhashchange = route;

// ── 로그인 / 최초 설정 ──
async function viewLogin() {
  const app = $('#main'); app.innerHTML = '<div class="card">불러오는 중…</div>';
  let st; try { st = await api('status'); } catch (e) { app.innerHTML = `<div class="card err">서버에 연결하지 못했습니다: ${esc(e.message)}</div>`; return; }
  if (st.needsSetup) {
    app.innerHTML = `<div class="card" style="margin-top:40px"><h2>처음 설정</h2>
      <p class="muted">이 사이트에 들어올 때 쓸 비밀번호를 정해 주세요. (각 8자 이상)</p>
      <label>관리자 비밀번호</label><input id="p1" type="text" class="pwm" autocomplete="off" spellcheck="false">
      <label>강사 공용 비밀번호</label><input id="p2" type="text" class="pwm" autocomplete="off" spellcheck="false">
      <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="sh" style="width:auto"> 비밀번호 보기</label>
      <div class="err" id="e"></div><div style="margin-top:14px"><button id="go">저장</button></div></div>`;
    $('#sh').onchange = (e) => { $('#p1').classList.toggle('pwm', !e.target.checked); $('#p2').classList.toggle('pwm', !e.target.checked); };
    $('#go').onclick = async () => {
      try { await api('setup', { directorPw: $('#p1').value, teacherPw: $('#p2').value }); viewLogin(); }
      catch (e) { $('#e').textContent = e.message; }
    };
    return;
  }
  app.innerHTML = `<div style="text-align:center;margin:40px 0 18px"><img src="${LOGO_WIDE}" alt="와이즈만 송도센터" style="display:block;margin:0 auto 14px;width:260px;max-width:80%;height:auto"><b style="font-size:24px;font-weight:800;background:linear-gradient(135deg,#0891b2,#059669);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">과학고 생기부 진단</b><div class="muted">서류 진단·처방 관리사이트</div></div><div class="card"><h2>로그인</h2>
    <label>비밀번호</label><input id="pw" type="text" class="pwm" autocomplete="off" spellcheck="false" autofocus>
    <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="sh" style="width:auto"> 비밀번호 보기</label>
    <div class="err" id="e"></div><div style="margin-top:14px"><button id="go">들어가기</button></div></div>`;
  const go = async () => {
    try { const r = await api('login', { password: $('#pw').value }); token = r.token; role = r.role; sessionStorage.setItem('sr_token', token); sessionStorage.setItem('sr_role', role); route(); }
    catch (e) { $('#e').textContent = e.message; }
  };
  $('#sh').onchange = (e) => { $('#pw').classList.toggle('pwm', !e.target.checked); };
  $('#go').onclick = go; $('#pw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

// ── 초기 화면(대시보드) ──
const GATE_LABEL = { pass: '통과', warn: '주의', fail: '탈락 요건' };
async function viewList() {
  const app = $('#main'); app.innerHTML = '<div class="card">불러오는 중…</div>';
  const [{ students }, st] = await Promise.all([api('listStudents'), api('getSettings')]);
  const target = st.scoring?.target ?? 310, centers = st.centers;
  const done = students.filter((x) => x.last), ok = done.filter((x) => x.last.total >= target), bad = done.filter((x) => x.last.gate === 'fail' || x.last.gate === 'warn');
  app.innerHTML = head('초기 화면 (대시보드)', '과학고 지원 학생의 생기부 진단 현황', '') + `
  <div class="stats">
    <div class="stat"><span>전체 학생</span><b>${students.length}</b></div>
    <div class="stat" style="--c:#06b6d4"><span>진단 완료</span><b>${done.length}</b></div>
    <div class="stat" style="--c:#10b981"><span>목표 ${target}점 이상</span><b>${ok.length}</b></div>
    <div class="stat" style="--c:#f59e0b"><span>내신 주의·탈락 요건</span><b>${bad.length}</b></div>
  </div>
  <div class="bar2">
    <div class="sr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="q" placeholder="학생명 또는 학교 검색"></div>
    <select id="fc"><option value="">센터 전체</option>${centers.map((c) => `<option>${esc(c)}</option>`).join('')}</select>
    <select id="fg"><option value="">내신 관문 전체</option><option value="pass">통과</option><option value="warn">주의</option><option value="fail">탈락 요건</option><option value="none">진단 전</option></select>
    <select id="fs"><option value="">반영 학기 전체</option><option value="A">1-2까지</option><option value="B">2-1까지</option><option value="C">2-2까지</option><option value="none">진단 전</option></select>
  </div>
  <div class="tw"><table><thead><tr><th>센터</th><th>학생명</th><th>학교</th><th>반영 학기</th><th>점수</th><th>내신 관문</th><th>진단일</th><th style="text-align:center">상세보기</th><th style="text-align:center">진단지 보기</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const draw = () => {
    const q = $('#q').value.trim(), fc = $('#fc').value, fg = $('#fg').value, fs = $('#fs').value;
    const rows = students.filter((x) => (!q || (x.name + (x.school || '')).includes(q)) && (!fc || x.center_name === fc) && (!fg || (fg === 'none' ? !x.last : x.last?.gate === fg)) && (!fs || (fs === 'none' ? !x.last : x.last?.stage === fs)));
    $('#tb').innerHTML = rows.map((x) => `<tr class="click" data-id="${x.id}"><td>${esc(x.center_name)}</td><td><span class="chip">${esc(x.name)}</span></td><td>${esc(x.school)}</td>
      <td>${x.last ? `<span class="pill">${TERM_UP[x.last.stage]}</span>` : '<span class="muted">-</span>'}</td>
      <td>${x.last ? `<span class="sc" style="color:${x.last.total >= target ? '#059669' : '#0f172a'}">${x.last.total ?? ''}</span>` : '<span class="muted">-</span>'}</td>
      <td>${x.last?.gate ? `<span class="pill ${x.last.gate}">${GATE_LABEL[x.last.gate]}</span>` : '<span class="pill none">진단 전</span>'}</td>
      <td class="muted">${x.last ? new Date(x.last.created_at).toLocaleDateString('ko-KR') : ''}</td><td style="text-align:center"><span class="btn-s">열기</span></td><td style="text-align:center">${x.last ? `<span class="btn-s rep" data-aid="${x.last.id}">열기</span>` : '<span class="muted">-</span>'}</td></tr>`).join('') || '<tr><td colspan=9 class="muted" style="text-align:center;padding:28px">조건에 맞는 학생이 없습니다. 왼쪽 위 [학생 등록]으로 추가하세요.</td></tr>';
    app.querySelectorAll('tr.click').forEach((tr) => tr.onclick = () => (location.hash = '#/student/' + tr.dataset.id));
    app.querySelectorAll('.rep').forEach((b) => b.onclick = (e) => { e.stopPropagation(); location.hash = '#/result/' + b.dataset.aid; });
  };
  ['q', 'fc', 'fg', 'fs'].forEach((i) => ($('#' + i).oninput = draw)); draw();
}

// ── 학생 상세: 업로드 + 진단 이력 ──
async function viewStudent(id) {
  const app = $('#main'); app.innerHTML = '<div class="card">불러오는 중…</div>';
  const [{ students }, { analyses }, { files }] = await Promise.all([api('listStudents'), api('listAnalyses', { studentId: id }), api('listRecordFiles', { studentId: id })]);
  const s = students.find((x) => x.id === id); if (!s) { location.hash = '#/'; return; }
  app.innerHTML = `
  ${head(esc(s.name), esc(s.school || '') + ' · ' + esc(s.center_name || ''), '<a href="#/">← 학생 목록</a>')}
  <div class="card"><div class="row" style="justify-content:space-between;align-items:center">
    <div><h2 class="t" style="margin:0">${analyses[0] ? '현재 반영 학기 ' + TERM_UP[analyses[0].stage] + ' · ' + (analyses[0].total ?? '') + '점' : '아직 진단 기록이 없습니다'}</h2>
    <div class="muted" style="margin-top:4px">${analyses[0] ? '새 학기가 끝나면 최신 생기부로 업데이트하세요. 이전 진단은 이력에 남습니다.' : '생기부 PDF를 올려 첫 진단을 시작하세요.'}</div></div>
    <button id="openUp">${analyses[0] ? '생기부 업데이트' : '첫 생기부 올리기'}</button></div>
    <div id="upBox" style="display:none;margin-top:16px;padding-top:14px;border-top:1px solid #e5e7eb">
    <label>업데이트할 학기 (생기부가 어디까지 작성되어 있나요?)</label>
    <select id="stage"><option value="">선택하세요</option>${['A', 'B', 'C'].map((k) => `<option value="${k}">${STAGE[k]} (${TERM_UP[k]})</option>`).join('')}</select>
    <label>업데이트할 생기부 PDF</label><input id="file" type="file" accept="application/pdf">
    <div class="err" id="e"></div><div id="prog" class="muted" style="margin-top:10px"></div>
    <div class="row" style="margin-top:12px"><button id="run">업로드하고 진단하기</button><button class="line" id="closeUp">닫기</button></div>
    <p class="muted">진단에는 2~5분 걸립니다. 창을 닫지 말고 기다려 주세요.</p></div></div>
  <div class="card"><h2>업로드한 생기부</h2><table><tbody>
    ${files.map((f) => `<tr><td>${new Date(f.uploaded_at).toLocaleString('ko-KR')}</td><td><span class="pill">${STAGE[f.stage]}</span></td><td>${esc(f.file_name)}</td>
      <td style="text-align:right"><button class="line rx" data-id="${f.id}" data-stage="${f.stage}">다시 진단</button> <button class="line pv" data-id="${f.id}">파싱 보기</button> <button class="line dx" data-id="${f.id}">원본 PDF 삭제</button></td></tr>`).join('') || '<tr><td class="muted">없음</td></tr>'}
  </tbody></table><div class="err" id="e2"></div></div>
  <div class="card"><h2>진단 이력</h2><table><thead><tr><th>진단 일시</th><th>반영 학기</th><th>점수</th><th>변화</th><th style="text-align:center">진단지 보기</th></tr></thead><tbody>
    ${analyses.map((a, i) => { const prev = analyses[i + 1]; const d = prev && a.total != null && prev.total != null ? a.total - prev.total : null; return `<tr class="click" data-id="${a.id}"><td>${new Date(a.created_at).toLocaleString('ko-KR')}</td><td><span class="pill">${TERM_UP[a.stage]}</span></td><td><b>${a.total ?? ''}점</b></td><td>${d === null ? '<span class="muted">-</span>' : `<span style="font-weight:700;color:${d >= 0 ? '#059669' : '#dc2626'}">${d >= 0 ? '+' : ''}${d}점</span> <span class="muted">(직전 대비)</span>`}</td><td style="text-align:center;white-space:nowrap"><span class="btn-s">열기</span> <span class="btn-s adm" data-aid="${a.id}" style="background:#334155">관리자용 점수 보기</span> <span class="btn-s dla" data-aid="${a.id}" style="background:#fff;color:#dc2626;border:1px solid #fca5a5">삭제</span></td></tr>`; }).join('') || '<tr><td class="muted">이력이 없습니다.</td></tr>'}
  </tbody></table>
  ${role === 'director' ? '<div style="margin-top:12px"><button class="line" id="arch">이 학생 목록에서 숨기기</button></div>' : ''}</div>`;
  app.querySelectorAll('tr.click').forEach((tr) => tr.onclick = () => (location.hash = '#/result/' + tr.dataset.id));
  app.querySelectorAll('.adm').forEach((b) => b.onclick = (e) => { e.stopPropagation(); if (role !== 'director') return alert('관리자에게 문의하세요.'); location.hash = '#/result/' + b.dataset.aid + '/admin'; });
  app.querySelectorAll('.dla').forEach((b) => b.onclick = async (e) => {
    e.stopPropagation(); if (role !== 'director') return alert('관리자에게 문의하세요.');
    const an = analyses.find((x) => x.id === b.dataset.aid);
    if (!confirm('이 진단 기록(' + new Date(an.created_at).toLocaleString('ko-KR') + ', ' + (an.total ?? '') + '점)을 삭제합니다.\n업로드한 생기부 파일은 남습니다. 되돌릴 수 없습니다.')) return;
    try { await api('deleteAnalysis', { analysisId: b.dataset.aid }); viewStudent(id); } catch (err) { alert(err.message); }
  });
  if ($('#arch')) $('#arch').onclick = async () => { if (confirm('목록에서 숨깁니다. (설정 화면에서 복구할 수 있습니다)')) { await api('archiveStudent', { studentId: id }); location.hash = '#/'; } };
  const busy = (m) => { $('#prog').innerHTML = m ? '<span class="spin"></span>' + m : ''; };
  app.querySelectorAll('.rx').forEach((b) => b.onclick = async () => {
    if (role !== 'director') return alert('관리자에게 문의하세요.');
    b.disabled = true; $('#e2').textContent = '';
    try {
      busy('저장된 생기부 텍스트로 다시 추출·채점 중… (1~2분)');
      const r = await api('extract', { recordFileId: b.dataset.id, stage: b.dataset.stage });
      busy('학기별 조언을 만드는 중…'); try { await api('advise', { analysisId: r.analysis.id }); } catch (e) { console.warn(e); }
      location.hash = '#/result/' + r.analysis.id;
    } catch (e) { busy(''); $('#e2').textContent = e.message; b.disabled = false; }
  });
  app.querySelectorAll('.pv').forEach((b) => b.onclick = async () => {
    if (role !== 'director') return alert('관리자에게 문의하세요.');
    try { const r = await api('getParsed', { recordFileId: b.dataset.id }); const w = window.open('', '_blank'); w.document.write('<pre style="white-space:pre-wrap;font:13px/1.5 sans-serif;padding:16px">' + esc(r.text) + '</pre>'); w.document.close(); }
    catch (e) { $('#e2').textContent = e.message; }
  });
  app.querySelectorAll('.dx').forEach((b) => b.onclick = async () => {
    if (role !== 'director') return alert('관리자에게 문의하세요.');
    if (!confirm('원본 PDF 파일을 완전히 삭제합니다. (파싱 텍스트와 진단 결과는 남습니다. 되돌릴 수 없습니다.)')) return;
    try { await api('deleteOriginal', { recordFileId: b.dataset.id }); viewStudent(id); } catch (e) { $('#e2').textContent = e.message; }
  });
  if ($('#openUp')) $('#openUp').onclick = () => { if (role !== 'director') return alert('관리자에게 문의하세요.'); $('#upBox').style.display = 'block'; $('#openUp').style.display = 'none'; };
  if ($('#closeUp')) $('#closeUp').onclick = () => { $('#upBox').style.display = 'none'; $('#openUp').style.display = ''; };
  if ($('#run')) $('#run').onclick = async () => {
    const f = $('#file').files[0], stage = $('#stage').value, prog = $('#prog'); $('#e').textContent = '';
    if (!stage) return ($('#e').textContent = '업데이트할 학기를 선택하세요.');
    if (!f) return ($('#e').textContent = 'PDF 파일을 선택하세요.');
    if (f.size > 18 * 1024 * 1024) return ($('#e').textContent = '파일이 18MB를 넘습니다.');
    $('#run').disabled = true;
    try {
      prog.innerHTML = '<span class="spin"></span>원본 업로드 중…';
      const u = await api('uploadUrl', { studentId: id, stage });
      const fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', f);
      const up = await fetch(u.signedUrl, { method: 'PUT', body: fd, headers: { 'x-upsert': 'false' } });
      if (!up.ok) throw new Error('업로드 실패 (' + up.status + ')');
      busy('① PDF를 텍스트로 변환하는 중… (1~2분)');
      const pr = await api('parse', { studentId: id, stage, path: u.path, fileName: f.name });
      busy('② 영역별 근거를 추출하고 채점하는 중… (1~2분)');
      const r = await api('extract', { recordFileId: pr.recordFileId, stage });
      busy('③ 학기별 조언을 만드는 중…');
      try { await api('advise', { analysisId: r.analysis.id }); } catch (e) { console.warn(e); }
      location.hash = '#/result/' + r.analysis.id;
    } catch (e) { $('#e').textContent = e.message; prog.textContent = ''; $('#run').disabled = false; }
  };
}

// ── 관리자 설정 ──

  const PN = { pdf: 'PDF 변환', common: '공통 지침', area1: '영역1 학업역량(1~12)', area2: '영역2 진로적합성(13~18)', area3: '영역3 인성(19~30)', gate: '내신 관문 추출', advice: '처방(조언) 생성' };
  const sc = st.scoring || { target: 310, cutoffs: [{ min: 310, label: '지원 매우 안정적(적극 권장)' }, { min: 290, label: '지원 다소 안정적(권장)' }, { min: 270, label: '지원 다소 불안정(소극 권장)' }, { min: 250, label: '지원 불안정(비권장)' }, { min: -1000, label: '서류 탈락 유력(지원 불가)' }] };

  <div class="card"><h2>센터 목록</h2><p class="muted">한 줄에 센터 하나씩. 학생 등록 화면의 선택 목록이 됩니다. (기존 학생의 센터 표기는 바뀌지 않습니다)</p>
    <textarea id="cen" rows="5" style="width:100%">${esc(st.centers.join('\n'))}</textarea><div class="err" id="e1"></div><button id="sc1" style="margin-top:8px">센터 목록 저장</button></div>

  <div class="card"><h2>목표 점수와 구간 기준</h2><p class="muted">3-1학기 기준 400점 체계. 이미 만든 진단 결과는 바뀌지 않고, 새로 진단·재진단할 때부터 적용됩니다.</p>
    <label>목표 점수</label><input id="tg" type="number" value="${sc.target}" style="max-width:140px">
    <label>구간 (점수 이상 → 문구). 마지막 줄은 나머지 전부입니다.</label>
    <div id="cuts">${sc.cutoffs.map((c, i) => `<div class="row" style="margin:4px 0"><input class="cm" type="number" value="${i === sc.cutoffs.length - 1 ? '' : c.min}" ${i === sc.cutoffs.length - 1 ? 'disabled placeholder="나머지"' : ''} style="max-width:100px"><input class="cl" value="${esc(c.label)}" style="flex:1"></div>`).join('')}</div>
    <div class="err" id="e2"></div><button id="sc2" style="margin-top:8px">기준 저장</button></div>

  <div class="card"><h2>숨긴 학생</h2><table><tbody>
    ${ar.students.map((x) => `<tr><td><b>${esc(x.name)}</b> <span class="muted">${esc(x.school)} · ${esc(x.center_name)}</span></td><td style="text-align:right"><button class="line rs" data-id="${x.id}">복구</button> <button class="line dl" data-id="${x.id}" data-name="${esc(x.name)}">완전 삭제</button></td></tr>`).join('') || '<tr><td class="muted">숨긴 학생이 없습니다.</td></tr>'}
  </tbody></table><div class="err" id="e3"></div></div>

  <div class="card"><h2>비밀번호 변경</h2>
    <label>변경할 대상</label><select id="pt"><option value="teacher">강사 공용 비밀번호</option><option value="director">관리자 비밀번호</option></select>
    <label>새 비밀번호 (8자 이상)</label><input id="np" type="text" class="pwm" autocomplete="off" spellcheck="false">
    <label>현재 관리자 비밀번호 (확인용)</label><input id="cp" type="text" class="pwm" autocomplete="off" spellcheck="false">
    <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="sh" style="width:auto"> 비밀번호 보기</label>
    <div class="err" id="e4"></div><button id="pw1" style="margin-top:8px">비밀번호 변경</button></div>

  <div class="card"><h2>AI 지시문 편집</h2><p class="muted">진단 결과가 달라질 수 있습니다. 저장하면 직전 버전이 보관되어 "이전 버전으로 되돌리기"가 가능합니다. 지시문 안의 JSON 형식 부분은 바꾸지 마세요.</p>
    <select id="pk">${pr.prompts.map((p) => `<option value="${p.key}">${PN[p.key] || p.key} (v${p.version})</option>`).join('')}</select>

  };
  app.querySelectorAll('.rs').forEach((b) => b.onclick = async () => { await api('restoreStudent', { studentId: b.dataset.id }); viewSettings(); });
  app.querySelectorAll('.dl').forEach((b) => b.onclick = async () => {

    if (n === null) return;
    try { await api('deleteStudent', { studentId: b.dataset.id, confirmName: n }); viewSettings(); } catch (e) { show('#e3', e.message); }
  });
  $('#sh').onchange = (e) => { $('#np').classList.toggle('pwm', !e.target.checked); $('#cp').classList.toggle('pwm', !e.target.checked); };
  $('#pw1').onclick = async () => {
    try { await api('changePassword', { target: $('#pt').value, newPassword: $('#np').value, currentPassword: $('#cp').value }); $('#np').value = ''; $('#cp').value = ''; show('#e4', '변경했습니다.', 1); } catch (e) { show('#e4', e.message); }
  };
  const loadP = () => { $('#pc').value = pr.prompts.find((p) => p.key === $('#pk').value).content; };
  $('#pk').onchange = loadP; loadP();
  $('#p1').onclick = async () => {
    if (!confirm('이 지시문을 저장합니다. 이후 진단부터 적용됩니다.')) return;
    try { await api('setPrompt', { key: $('#pk').value, content: $('#pc').value }); show('#e5', '저장했습니다.', 1); const k = $('#pk').value; const f = await api('listPrompts'); pr.prompts = f.prompts; } catch (e) { show('#e5', e.message); }
  };
  $('#p2').onclick = async () => {
    try { await api('restorePrompt', { key: $('#pk').value }); const f = await api('listPrompts'); pr.prompts = f.prompts; loadP(); show('#e5', '이전 버전으로 되돌렸습니다.', 1); } catch (e) { show('#e5', e.message); }
  };
}

// ── 결과 리포트 (4쪽): 1 진단 / 2 30개 항목 / 3 보완 항목 / 4 남은 학기 실행 계획 ──
async function viewResult(aid, adm = false) {
  const app = $('#main'); app.innerHTML = '<div class="card">불러오는 중…</div>';
  const { analysis: a, student: stu } = await api('getAnalysis', { analysisId: aid });
  const s = a.scores_json, adv = a.advice_json, g = s.gate;
  const areaNames = ['학업역량', '진로적합성', '인성'];
  const pub = (t) => adm ? String(t ?? '') : String(t ?? '').replace(/\s*[(（\[]?\s*(?:최대\s*)?[+＋]\s*\d+(?:\.\d+)?\s*점\s*[)）\]]?/g, '').trim();
  const T = (t) => esc(pub(t));
  const pc1 = (c, m) => (Math.max(0, c) / m * 100).toFixed(1) + '%';
  const remOf = (i) => s.items.filter((x) => x.area === i + 1).reduce((t, x) => t + x.remaining, 0);
  const rows = [0, 1, 2].map((i) => ({ name: '영역 ' + (i + 1) + ' · ' + areaNames[i], cur: s.areaCurrent[i], max: s.areaMax[i], rem: remOf(i) }));
  const bar = (r, tot) => { const c = Math.max(0, r.cur), p1 = c / r.max * 100, p2 = Math.min(r.rem, r.max - c) / r.max * 100;
    return `<div class="ar ${tot ? 'tot' : ''}"><div class="ar-h"><b>${r.name}</b><span class="ar-n"><em>${r.cur}</em> / ${r.max}점</span></div>
      <div class="trk"><i class="a" style="width:${p1}%"></i><i class="b" style="left:${p1}%;width:${p2}%"></i></div>
      <div class="ar-f"><span>달성 ${Math.round(p1)}%</span><span>남은 학기에 최대 +${r.rem}점</span><span>만점까지 ${r.max - c}점</span></div></div>`; };
    const cell = (i) => { const mx = i.no === 30 ? 0 : i.max; const pct = mx > 0 ? Math.max(0, i.current) / mx * 100 : 0;
    return `<div class="cell ${i.status}"><div class="ct">${i.no}. ${esc(i.title)}</div><div class="cv">${adm ? `<b>${i.current}</b><span>${i.no === 30 ? '점 (감점)' : '/ ' + mx + '점'}</span>` : mx > 0 ? `<b>${pct.toFixed(1)}</b><span>%</span>` : `<b style="font-size:16px">${i.status === 'penalized' ? '감점 발생' : '감점 없음'}</b>`}</div><div class="mb"><i style="width:${pct}%"></i></div></div>`; };
  const grp = [[1, 12, 0], [13, 18, 1], [19, 30, 2]].map(([lo, hi, ai]) => `<div class="grp"><div class="sub"><b>영역 ${ai + 1} · ${areaNames[ai]}</b><span>${s.areaCurrent[ai]} / ${s.areaMax[ai]}점</span></div><div class="cells">${s.items.filter((x) => x.no >= lo && x.no <= hi).map(cell).join('')}</div></div>`).join('');
  const gateHtml = g ? `<div class="gate ${g.status}"><b class="t">${g.status === 'fail' ? '탈락 요건 해당' : g.status === 'warn' ? '주의 (B 2개)' : '현재 통과'}</b>
    <div>${esc(g.message)}</div>
    <div class="muted" style="margin-top:4px;font-size:14px">반영 과목 ${g.counted}개 · B ${g.bCount}개 · C 이하 ${g.cCount}개${g.mathSciB?.length ? ' · 수학·과학 B 이하: ' + esc(g.mathSciB.join(', ')) : ''}</div>
    ${g.reasons?.length ? `<ul class="tight">${g.reasons.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}</div>` : '';
  // 점수 링: 현재(진한 색) + 남은 학기 최대(연한 색) + 목표 눈금
  const R = 78, C = 2 * Math.PI * R, pc = Math.max(0, s.currentTotal) / 400, pb = Math.max(pc, Math.min(1, s.bestCaseTotal / 400)), tg = Math.min(1, s.targetScore / 400);
  const ta = tg * 2 * Math.PI, tx1 = 94 + (R - 9) * Math.cos(ta), ty1 = 94 + (R - 9) * Math.sin(ta), tx2 = 94 + (R + 9) * Math.cos(ta), ty2 = 94 + (R + 9) * Math.sin(ta);
  const ring = `<div class="ring"><svg viewBox="0 0 188 188"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs>
    <circle cx="94" cy="94" r="${R}" fill="none" stroke="#dbe7ee" stroke-width="15"/>
    <circle cx="94" cy="94" r="${R}" fill="none" stroke="#a7e8d3" stroke-width="15" stroke-dasharray="${pb * C} ${C}" stroke-linecap="round"/>
    <circle cx="94" cy="94" r="${R}" fill="none" stroke="url(#rg)" stroke-width="15" stroke-dasharray="${pc * C} ${C}" stroke-linecap="round"/>
    <line x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/></svg>
    <div class="c"><span>현재 점수</span><b>${s.currentTotal}</b><span>/ 400점</span></div></div>`;
  const hero = `<div class="hero">${ring}<div class="hs">
    <div><span>목표 ${s.targetScore}점까지</span><b>${s.gapToTarget > 0 ? s.gapToTarget + '점 부족' : '달성'}</b></div>
    <div><span>남은 학기 최대 도달</span><b>${s.bestCaseTotal}점</b></div>
    <div><span>반영 학기</span><b class="sm">${TERM_KO[a.stage]}까지 반영</b><em class="hn">현재 점수 ${s.currentTotal}점 기준</em></div>
    <div><span>최대 도달 시 지원 구간</span><b class="sm">${esc(s.bestCaseBand)}</b></div></div></div>
    <div class="lg2" style="margin-top:8px"><span><i style="background:#10b981"></i>현재 점수</span><span><i style="background:#a7e8d3"></i>남은 학기 최대 도달</span><span><i style="background:#0f172a"></i>목표 점수 위치</span></div>`;
  const itm = (no) => s.items.find((y) => y.no === no);
  const adviceItems = adv ? `
    <div class="sum">${T(adv.summary)}</div>
    <div class="sub"><b>우선 보완 항목별 방법</b><small>우선순위 순</small></div>
    ${(adv.itemAdvice || []).slice(0, 6).map((x) => { const it = itm(x.no); return `<div class="adv"><div class="ar2"><b>${x.no}. ${esc(x.title)}</b>${it ? (adm ? `<span class="w">현재 ${it.current}/${it.max}점 · 최대 +${it.remaining}점</span>` : it.max > 0 ? `<span class="w">달성 ${pc1(it.current, it.max)}</span>` : '') : ''}</div><div>${T(x.advice)}</div>
      ${x.examples?.length ? `<div class="ex">합격자 기록 사례: ${x.examples.map(esc).join(' / ')}</div>` : ''}</div>`; }).join('')}`
    : `<p class="muted">조언을 만들지 못했습니다. <button id="reAdv" class="ghost noprint">다시 만들기</button></p>`;
  const act = (t, i) => typeof t === 'string'
    ? `<div class="ac"><div class="n">${i + 1}</div><div><b>${T(t)}</b></div></div>`
    : `<div class="ac"><div class="n">${i + 1}</div><div><div class="ar2"><b>${T(t.what)}</b>${t.why && T(t.why).trim() ? `<span class="w">${T(t.why)}</span>` : ''}</div>${t.how ? `<div class="h">${T(t.how)}</div>` : ''}</div></div>`;
  const roadmap = adv ? (adv.roadmap || []).map((r) => `<div class="rt"><div class="rt-h"><span class="pill">${esc(r.term)}학기</span>${r.focus ? `<span class="f">${T(r.focus)}</span>` : ''}</div>${(r.actions || []).map(act).join('')}</div>`).join('') : '';
  const head3 = () => `<div class="rh"><div class="rh-c">생활기록부 진단 리포트</div><img class="rlogo" src="${LOGO_WIDE}" alt="와이즈만 송도센터"></div>`;
  const foot = (n, m) => `<div class="pf"><span>${m || '생활기록부 진단 · ' + esc(stu.name)}</span><span></span></div>`;

  app.innerHTML = `
  <div class="row noprint" style="margin-bottom:12px"><a href="#/student/${a.student_id}">← ${esc(stu.name)} 학생</a><span style="flex:1"></span>
    <button class="line" id="orig">원본 생기부 PDF 열기</button>${adv ? '<button class="line" id="reAdv2">조언 다시 만들기</button>' : ''}${adm ? '' : '<button id="pdf">PDF로 저장 / 인쇄</button>'}</div>
  ${adm ? '<div class="admwarn">관리자 전용 보기 · 항목별 점수·배점 포함 · 학부모에게 제공하지 마세요</div>' : ''}

  <section class="page">
    ${head3()}
    <div class="rs"><h2>${esc(stu.name)}</h2><div class="meta"><span class="pill none">${esc(stu.school || '학교 미입력')}</span><span class="pill none">${esc(stu.center_name || '')}</span><span class="pill">반영 학기 ${TERM_UP[a.stage]}</span></div></div>
    ${g ? '<div class="sec" style="margin-top:4px">① 내신(성취도) 관문</div>' : ''}
    ${gateHtml}
    <div class="sec">② 생기부 총점 <small>내신 관문 통과 후 평가</small></div>
    ${hero}
    <div class="sec">③ 영역별 현황</div>
    <div class="lg2"><span><i style="background:linear-gradient(90deg,#06b6d4,#10b981)"></i>현재 점수</span><span><i style="background:repeating-linear-gradient(135deg,#a7e8d3 0 3px,#d1f4e7 3px 6px)"></i>남은 학기에 더 얻을 수 있는 점수</span><span><i style="background:#e8eef3"></i>올리기 어려운 부분</span></div>
    ${rows.map((r) => bar(r)).join('')}
    ${bar({ name: '전체 합계', cur: s.currentTotal, max: 400, rem: s.bestCaseTotal - s.currentTotal }, true)}
    ${foot(1)}
  </section>

  <section class="page">
    ${head3()}
    <div class="sec" style="margin-top:4px">④ 30개 항목 한눈에</div>
    <div class="lg2"><span><i style="background:#ecfdf3;border-color:#86efac"></i>만점</span><span><i style="background:#fff8eb;border-color:#fcd34d"></i>보완하면 더 얻을 수 있음</span><span><i style="background:#eef2ff;border-color:#a5b4fc"></i>감점형(현재 감점 없음)</span><span><i style="background:#fef2f2;border-color:#fca5a5"></i>감점 발생</span><span><i style="background:#f8fafc"></i>더 올릴 수 없음</span></div>
    ${grp}
    ${foot(2)}
  </section>

  <section class="page">
    ${head3()}
    <div class="sec" style="margin-top:4px">⑤ 종합 의견</div>
    ${adviceItems}
    ${foot(3)}
  </section>

  <section class="page">
    ${head3()}
    <div class="sec" style="margin-top:4px">⑥ 남은 학기별 실행 계획 추천</div>
    ${g ? `<div class="gate ${g.status}" style="margin-top:0"><b>가장 먼저: 남은 학기 전 과목 올A 관리</b><br>남은 학기(${esc(g.remainingTerms.join(', '))})는 수학·과학 B 1개도 안 되고, 그 외 과목도 B 3개 이상 또는 C 1개 이상이면 1차 서류에서 탈락합니다.</div>` : ''}
    ${roadmap || '<p class="muted">실행 계획이 아직 없습니다.</p>'}
    ${adv?.penaltyWarnings?.length ? '<div class="sub"><b>감점 주의</b><small>지켜야 할 점수</small></div>' : ''}
    ${adv?.penaltyWarnings?.length ? `<ul class="wn">${adv.penaltyWarnings.map((t) => `<li>${T(t)}</li>`).join('')}</ul>` : ''}
    ${foot(4, '대회·활동 이름은 예시이며 학교마다 개설 여부가 다릅니다. 합격을 보장하지 않습니다.')}
  </section>`;
  if ($('#pdf')) $('#pdf').onclick = () => print();
  $('#orig').onclick = async () => { try { const r = await api('recordUrl', { analysisId: aid }); window.open(r.url, '_blank'); } catch (e) { alert(e.message); } };
  const reAdv = async (btn) => { if (role !== 'director') return alert('관리자에게 문의하세요.'); btn.disabled = true; btn.textContent = '만드는 중… (1~2분)'; try { await api('advise', { analysisId: aid }); viewResult(aid); } catch (e) { alert(e.message); viewResult(aid); } };
  if ($('#reAdv')) $('#reAdv').onclick = (ev) => reAdv(ev.target);
  if ($('#reAdv2')) $('#reAdv2').onclick = (ev) => { if (role !== 'director') return alert('관리자에게 문의하세요.'); if (confirm('조언(보완 방법·실행 계획)만 새로 만듭니다. 점수는 바뀌지 않습니다.')) reAdv(ev.target); };
}

route().catch((e) => { $('#main').innerHTML = `<div class="card err">${esc(e.message)}</div>`; });
</script>
</body>
</html>
