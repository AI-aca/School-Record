<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>과학고 생기부 진단</title>
<style>
:root{color-scheme:light;--bg:#f6f8fb;--card:#fff;--ink:#1d2733;--sub:#6b7785;--line:#e3e8ef;--pri:#2563eb;--pri2:#eaf1ff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:15px;line-height:1.5}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header.top h1{font-size:17px;margin:0;flex:1}
.wrap{max-width:980px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 12px}
input,select,textarea{color:#1d2733;-webkit-text-fill-color:#1d2733;caret-color:#1d2733;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.pwm{-webkit-text-security:disc;text-security:disc}
label{font-size:13px;color:var(--sub);display:block;margin:10px 0 4px}
button{font:inherit;border:0;border-radius:8px;padding:9px 16px;background:var(--pri);color:#fff;cursor:pointer}
button.ghost{background:var(--pri2);color:var(--pri)}
button.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--sub);font-size:13px}
.err{color:var(--bad);font-size:14px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:12px}
tr.click{cursor:pointer}tr.click:hover{background:#f1f5fb}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--pri2);color:var(--pri)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--sub)}
.bar{height:12px;background:#edf1f6;border-radius:6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--pri)}
.bar i.r{position:absolute;top:0;background:#bcd3ff}
.cells{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:11px}
.cell b{font-size:13px}
.cell.done{background:#ecfdf3}.cell.improvable{background:#fff8eb}.cell.pending{background:#eef2ff}.cell.penalized{background:#fef2f2}
.gate{border:2px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0}
.gate.pass{border-color:#16a34a;background:#f0fdf4}.gate.warn{border-color:#d97706;background:#fffbeb}.gate.fail{border-color:#dc2626;background:#fef2f2}
.gate b.t{font-size:15px}
.hidden{display:none!important}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #cbd5e1;border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.page{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:16px}
.page h3{margin:16px 0 8px;font-size:15px}
ul.tight{margin:4px 0 0;padding-left:18px}
@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.cells{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:9mm}
  body{background:#fff;font-size:10.5px;line-height:1.4}
  .page h3{margin:7px 0 4px;font-size:12.5px}.page p.muted{margin:6px 0 0}.bar{height:9px}
  .kpi b{font-size:20px}th,td{padding:4px 5px}.cell{padding:3px 5px;font-size:10px}.page h2{margin-bottom:4px}
  header.top,.noprint{display:none!important}
  .wrap{padding:0;max-width:none}
  .page{border:0;border-radius:0;padding:0;margin:0;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto}
}
</style>
</head>
<body>
<header class="top">
  <h1>과학고 생기부 진단</h1>
  <span id="who" class="muted"></span>
  <a id="setlink" href="#/settings" class="hidden" style="margin-left:auto">설정</a>
  <button id="logout" class="line hidden">로그아웃</button>
</header>
<div class="wrap" id="app"></div>

<script>
// ▼ 서버 주소 (Supabase Edge Function 'api')
const API = 'https://xphtctpbysbbdyjaxidh.supabase.co/functions/v1/api';

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const STAGE = { A: '1학년 2학기까지 완료', B: '2학년 1학기까지 완료', C: '2학년 2학기까지 완료' };
let token = sessionStorage.getItem('sr_token') || '', role = sessionStorage.getItem('sr_role') || '';

async function api(action, body = {}) {
  const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json', 'x-app-token': token }, body: JSON.stringify({ action, ...body }) });
  const j = await r.json().catch(() => ({ error: '서버 응답을 읽지 못했습니다.' }));
  if (r.status === 401 && token) { logout(); }
  if (!r.ok) throw new Error(j.error || '오류 ' + r.status);
  return j;
}
function logout() { token = ''; role = ''; sessionStorage.clear(); route(); }
$('#logout').onclick = logout;

// ── 화면 전환 ──
async function route() {
  $('#who').textContent = role ? (role === 'director' ? '관리자' : '강사') : '';
  $('#logout').classList.toggle('hidden', !token);
  $('#setlink').classList.toggle('hidden', !(token && role === 'director'));
  if (!token) return viewLogin();
  const h = location.hash;
  if (h === '#/settings') return role === 'director' ? viewSettings() : viewList();
  if (h.startsWith('#/student/')) return viewStudent(h.split('/')[2]);
  if (h.startsWith('#/result/')) return viewResult(h.split('/')[2]);
  return viewList();
}
window.onhashchange = route;

// ── 로그인 / 최초 설정 ──
async function viewLogin() {
  const app = $('#app'); app.innerHTML = '<div class="card">불러오는 중…</div>';
  let st; try { st = await api('status'); } catch (e) { app.innerHTML = `<div class="card err">서버에 연결하지 못했습니다: ${esc(e.message)}</div>`; return; }
  if (st.needsSetup) {
    app.innerHTML = `<div class="card" style="max-width:420px;margin:40px auto"><h2>처음 설정</h2>
      <p class="muted">이 사이트에 들어올 때 쓸 비밀번호를 정해 주세요. (각 8자 이상)</p>
      <label>관리자 비밀번호</label><input id="p1" type="text" class="pwm" autocomplete="off" spellcheck="false">
      <label>강사 공용 비밀번호</label><input id="p2" type="text" class="pwm" autocomplete="off" spellcheck="false">
      <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="sh" style="width:auto"> 비밀번호 보기</label>
      <div class="err" id="e"></div><div style="margin-top:14px"><button id="go">저장</button></div></div>`;
    $('#sh').onchange = (e) => { $('#p1').classList.toggle('pwm', !e.target.checked); $('#p2').classList.toggle('pwm', !e.target.checked); };
    $('#go').onclick = async () => {
      try { await api('setup', { directorPw: $('#p1').value, teacherPw: $('#p2').value }); viewLogin(); }
      catch (e) { $('#e').textContent = e.message; }
    };
    return;
  }
  app.innerHTML = `<div class="card" style="max-width:380px;margin:40px auto"><h2>로그인</h2>
    <label>비밀번호</label><input id="pw" type="text" class="pwm" autocomplete="off" spellcheck="false" autofocus>
    <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="sh" style="width:auto"> 비밀번호 보기</label>
    <div class="err" id="e"></div><div style="margin-top:14px"><button id="go">들어가기</button></div></div>`;
  const go = async () => {
    try { const r = await api('login', { password: $('#pw').value }); token = r.token; role = r.role; sessionStorage.setItem('sr_token', token); sessionStorage.setItem('sr_role', role); route(); }
    catch (e) { $('#e').textContent = e.message; }
  };
  $('#sh').onchange = (e) => { $('#pw').classList.toggle('pwm', !e.target.checked); };
  $('#go').onclick = go; $('#pw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

// ── 학생 목록 + 등록 ──
async function viewList() {
  const app = $('#app'); app.innerHTML = '<div class="card">불러오는 중…</div>';
  const [{ students }, { centers }] = await Promise.all([api('listStudents'), api('getSettings')]);
  app.innerHTML = `
  <div class="card"><h2>학생 등록</h2>
    <div class="grid2">
      <div><label>이름 *</label><input id="n"></div><div><label>학교</label><input id="sc"></div>
      <div><label>센터 *</label><select id="ce"><option value="">선택</option>${centers.map((c) => `<option>${esc(c)}</option>`).join('')}</select></div>
    </div><label>메모</label><input id="me">
    <div class="err" id="e"></div><div style="margin-top:12px"><button id="add">등록</button></div></div>
  <div class="card"><h2>학생 목록 <span class="muted">(${students.length}명)</span></h2>
    <table><thead><tr><th>이름</th><th>학교</th><th>센터</th><th>최근 진단</th></tr></thead><tbody>
    ${students.map((s) => `<tr class="click" data-id="${s.id}"><td><b>${esc(s.name)}</b></td><td>${esc(s.school)}</td><td>${esc(s.center_name)}</td>
      <td>${s.last ? `<span class="pill">${STAGE[s.last.stage]}</span> ${s.last.total ?? ''}점` : '<span class="muted">없음</span>'}</td></tr>`).join('') || '<tr><td colspan=4 class="muted">아직 등록된 학생이 없습니다.</td></tr>'}
    </tbody></table></div>`;
  app.querySelectorAll('tr.click').forEach((tr) => tr.onclick = () => (location.hash = '#/student/' + tr.dataset.id));
  $('#add').onclick = async () => {
    if (!$('#ce').value) { $('#e').textContent = '센터를 선택하세요.'; return; }
    try { await api('addStudent', { name: $('#n').value.trim(), school: $('#sc').value, center_name: $('#ce').value, memo: $('#me').value }); viewList(); }
    catch (e) { $('#e').textContent = e.message; }
  };
}

// ── 학생 상세: 업로드 + 진단 이력 ──
async function viewStudent(id) {
  const app = $('#app'); app.innerHTML = '<div class="card">불러오는 중…</div>';
  const [{ students }, { analyses }, { files }] = await Promise.all([api('listStudents'), api('listAnalyses', { studentId: id }), api('listRecordFiles', { studentId: id })]);
  const s = students.find((x) => x.id === id); if (!s) { location.hash = '#/'; return; }
  app.innerHTML = `
  <p><a href="#/">← 학생 목록</a></p>
  <div class="card"><h2>${esc(s.name)} <span class="muted">${esc(s.school)}</span></h2>
    <label>생기부가 어디까지 작성되어 있나요?</label>
    <select id="stage"><option value="A">${STAGE.A}</option><option value="B">${STAGE.B}</option><option value="C">${STAGE.C}</option></select>
    <label>생기부 PDF</label><input id="file" type="file" accept="application/pdf">
    <div class="err" id="e"></div><div id="prog" class="muted" style="margin-top:10px"></div>
    <div style="margin-top:12px"><button id="run">업로드하고 진단하기</button></div>
    <p class="muted">진단에는 2~5분 걸립니다. 창을 닫지 말고 기다려 주세요.</p></div>
  <div class="card"><h2>업로드한 생기부</h2><table><tbody>
    ${files.map((f) => `<tr><td>${new Date(f.uploaded_at).toLocaleString('ko-KR')}</td><td><span class="pill">${STAGE[f.stage]}</span></td><td>${esc(f.file_name)}</td>
      <td style="text-align:right"><button class="line rx" data-id="${f.id}" data-stage="${f.stage}">다시 진단</button> <button class="line pv" data-id="${f.id}">파싱 보기</button>${role === 'director' ? ` <button class="line dx" data-id="${f.id}">원본 PDF 삭제</button>` : ''}</td></tr>`).join('') || '<tr><td class="muted">없음</td></tr>'}
  </tbody></table><div class="err" id="e2"></div></div>
  <div class="card"><h2>진단 이력</h2><table><tbody>
    ${analyses.map((a) => `<tr class="click" data-id="${a.id}"><td>${new Date(a.created_at).toLocaleString('ko-KR')}</td><td><span class="pill">${STAGE[a.stage]}</span></td><td>${a.total ?? ''}점</td></tr>`).join('') || '<tr><td class="muted">이력이 없습니다.</td></tr>'}
  </tbody></table>
  ${role === 'director' ? '<div style="margin-top:12px"><button class="line" id="arch">이 학생 목록에서 숨기기</button></div>' : ''}</div>`;
  app.querySelectorAll('tr.click').forEach((tr) => tr.onclick = () => (location.hash = '#/result/' + tr.dataset.id));
  if ($('#arch')) $('#arch').onclick = async () => { if (confirm('목록에서 숨깁니다. (설정 화면에서 복구할 수 있습니다)')) { await api('archiveStudent', { studentId: id }); location.hash = '#/'; } };
  const busy = (m) => { $('#prog').innerHTML = m ? '<span class="spin"></span>' + m : ''; };
  app.querySelectorAll('.rx').forEach((b) => b.onclick = async () => {
    b.disabled = true; $('#e2').textContent = '';
    try {
      busy('저장된 생기부 텍스트로 다시 추출·채점 중… (1~2분)');
      const r = await api('extract', { recordFileId: b.dataset.id, stage: b.dataset.stage });
      busy('학기별 조언을 만드는 중…'); try { await api('advise', { analysisId: r.analysis.id }); } catch (e) { console.warn(e); }
      location.hash = '#/result/' + r.analysis.id;
    } catch (e) { busy(''); $('#e2').textContent = e.message; b.disabled = false; }
  });
  app.querySelectorAll('.pv').forEach((b) => b.onclick = async () => {
    try { const r = await api('getParsed', { recordFileId: b.dataset.id }); const w = window.open('', '_blank'); w.document.write('<pre style="white-space:pre-wrap;font:13px/1.5 sans-serif;padding:16px">' + esc(r.text) + '</pre>'); w.document.close(); }
    catch (e) { $('#e2').textContent = e.message; }
  });
  app.querySelectorAll('.dx').forEach((b) => b.onclick = async () => {
    if (!confirm('원본 PDF 파일을 완전히 삭제합니다. (파싱 텍스트와 진단 결과는 남습니다. 되돌릴 수 없습니다.)')) return;
    try { await api('deleteOriginal', { recordFileId: b.dataset.id }); viewStudent(id); } catch (e) { $('#e2').textContent = e.message; }
  });
  $('#run').onclick = async () => {
    const f = $('#file').files[0], stage = $('#stage').value, prog = $('#prog'); $('#e').textContent = '';
    if (!f) return ($('#e').textContent = 'PDF 파일을 선택하세요.');
    if (f.size > 18 * 1024 * 1024) return ($('#e').textContent = '파일이 18MB를 넘습니다.');
    $('#run').disabled = true;
    try {
      prog.innerHTML = '<span class="spin"></span>원본 업로드 중…';
      const u = await api('uploadUrl', { studentId: id, stage });
      const fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', f);
      const up = await fetch(u.signedUrl, { method: 'PUT', body: fd, headers: { 'x-upsert': 'false' } });
      if (!up.ok) throw new Error('업로드 실패 (' + up.status + ')');
      busy('① PDF를 텍스트로 변환하는 중… (1~2분)');
      const pr = await api('parse', { studentId: id, stage, path: u.path, fileName: f.name });
      busy('② 영역별 근거를 추출하고 채점하는 중… (1~2분)');
      const r = await api('extract', { recordFileId: pr.recordFileId, stage });
      busy('③ 학기별 조언을 만드는 중…');
      try { await api('advise', { analysisId: r.analysis.id }); } catch (e) { console.warn(e); }
      location.hash = '#/result/' + r.analysis.id;
    } catch (e) { $('#e').textContent = e.message; prog.textContent = ''; $('#run').disabled = false; }
  };
}

// ── 관리자 설정 ──
async function viewSettings() {
  const app = $('#app'); app.innerHTML = '<div class="card">불러오는 중…</div>';
  const [st, ar, pr] = await Promise.all([api('getSettings'), api('listArchived'), api('listPrompts')]);
  const PN = { pdf: 'PDF 변환', common: '공통 지침', area1: '영역1 학업역량(1~12)', area2: '영역2 진로적합성(13~18)', area3: '영역3 인성(19~30)', gate: '내신 관문 추출', advice: '처방(조언) 생성' };
  const sc = st.scoring || { target: 310, cutoffs: [{ min: 310, label: '지원 매우 안정적(적극 권장)' }, { min: 290, label: '지원 다소 안정적(권장)' }, { min: 270, label: '지원 다소 불안정(소극 권장)' }, { min: 250, label: '지원 불안정(비권장)' }, { min: -1000, label: '서류 탈락 유력(지원 불가)' }] };
  app.innerHTML = `<p><a href="#/">← 학생 목록</a></p>
  <div class="card"><h2>센터 목록</h2><p class="muted">한 줄에 센터 하나씩. 학생 등록 화면의 선택 목록이 됩니다. (기존 학생의 센터 표기는 바뀌지 않습니다)</p>
    <textarea id="cen" rows="5" style="width:100%">${esc(st.centers.join('\n'))}</textarea><div class="err" id="e1"></div><button id="sc1" style="margin-top:8px">센터 목록 저장</button></div>

  <div class="card"><h2>목표 점수와 구간 기준</h2><p class="muted">3-1학기 기준 400점 체계. 이미 만든 진단 결과는 바뀌지 않고, 새로 진단·재진단할 때부터 적용됩니다.</p>
    <label>목표 점수</label><input id="tg" type="number" value="${sc.target}" style="max-width:140px">
    <label>구간 (점수 이상 → 문구). 마지막 줄은 나머지 전부입니다.</label>
    <div id="cuts">${sc.cutoffs.map((c, i) => `<div class="row" style="margin:4px 0"><input class="cm" type="number" value="${i === sc.cutoffs.length - 1 ? '' : c.min}" ${i === sc.cutoffs.length - 1 ? 'disabled placeholder="나머지"' : ''} style="max-width:100px"><input class="cl" value="${esc(c.label)}" style="flex:1"></div>`).join('')}</div>
    <div class="err" id="e2"></div><button id="sc2" style="margin-top:8px">기준 저장</button></div>

  <div class="card"><h2>숨긴 학생</h2><table><tbody>
    ${ar.students.map((x) => `<tr><td><b>${esc(x.name)}</b> <span class="muted">${esc(x.school)} · ${esc(x.center_name)}</span></td><td style="text-align:right"><button class="line rs" data-id="${x.id}">복구</button> <button class="line dl" data-id="${x.id}" data-name="${esc(x.name)}">완전 삭제</button></td></tr>`).join('') || '<tr><td class="muted">숨긴 학생이 없습니다.</td></tr>'}
  </tbody></table><div class="err" id="e3"></div></div>

  <div class="card"><h2>비밀번호 변경</h2>
    <label>변경할 대상</label><select id="pt"><option value="teacher">강사 공용 비밀번호</option><option value="director">관리자 비밀번호</option></select>
    <label>새 비밀번호 (8자 이상)</label><input id="np" type="text" class="pwm" autocomplete="off" spellcheck="false">
    <label>현재 관리자 비밀번호 (확인용)</label><input id="cp" type="text" class="pwm" autocomplete="off" spellcheck="false">
    <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="sh" style="width:auto"> 비밀번호 보기</label>
    <div class="err" id="e4"></div><button id="pw1" style="margin-top:8px">비밀번호 변경</button></div>

  <div class="card"><h2>AI 지시문 편집</h2><p class="muted">진단 결과가 달라질 수 있습니다. 저장하면 직전 버전이 보관되어 "이전 버전으로 되돌리기"가 가능합니다. 지시문 안의 JSON 형식 부분은 바꾸지 마세요.</p>
    <select id="pk">${pr.prompts.map((p) => `<option value="${p.key}">${PN[p.key] || p.key} (v${p.version})</option>`).join('')}</select>
    <textarea id="pc" rows="18" style="width:100%;margin-top:8px;font-size:12px"></textarea>
    <div class="err" id="e5"></div><button id="p1">저장</button> <button class="line" id="p2">이전 버전으로 되돌리기</button></div>`;

  const show = (id, m, ok) => { const e = $(id); e.textContent = m; e.style.color = ok ? 'var(--ok,#16a34a)' : ''; };
  $('#sc1').onclick = async () => { try { const r = await api('setCenters', { centers: $('#cen').value.split('\n') }); $('#cen').value = r.centers.join('\n'); show('#e1', '저장했습니다.', 1); } catch (e) { show('#e1', e.message); } };
  $('#sc2').onclick = async () => {
    const ms = [...app.querySelectorAll('.cm')], ls = [...app.querySelectorAll('.cl')];
    const cutoffs = ls.map((l, i) => ({ min: i === ls.length - 1 ? -1000 : Number(ms[i].value), label: l.value }));
    try { await api('setScoring', { target: Number($('#tg').value), cutoffs }); show('#e2', '저장했습니다. 이후 진단부터 적용됩니다.', 1); } catch (e) { show('#e2', e.message); }
  };
  app.querySelectorAll('.rs').forEach((b) => b.onclick = async () => { await api('restoreStudent', { studentId: b.dataset.id }); viewSettings(); });
  app.querySelectorAll('.dl').forEach((b) => b.onclick = async () => {
    const n = prompt(`'${b.dataset.name}' 학생의 모든 자료(PDF·진단)를 완전히 삭제합니다. 되돌릴 수 없습니다.\n확인을 위해 학생 이름을 입력하세요.`);
    if (n === null) return;
    try { await api('deleteStudent', { studentId: b.dataset.id, confirmName: n }); viewSettings(); } catch (e) { show('#e3', e.message); }
  });
  $('#sh').onchange = (e) => { $('#np').classList.toggle('pwm', !e.target.checked); $('#cp').classList.toggle('pwm', !e.target.checked); };
  $('#pw1').onclick = async () => {
    try { await api('changePassword', { target: $('#pt').value, newPassword: $('#np').value, currentPassword: $('#cp').value }); $('#np').value = ''; $('#cp').value = ''; show('#e4', '변경했습니다.', 1); } catch (e) { show('#e4', e.message); }
  };
  const loadP = () => { $('#pc').value = pr.prompts.find((p) => p.key === $('#pk').value).content; };
  $('#pk').onchange = loadP; loadP();
  $('#p1').onclick = async () => {
    if (!confirm('이 지시문을 저장합니다. 이후 진단부터 적용됩니다.')) return;
    try { await api('setPrompt', { key: $('#pk').value, content: $('#pc').value }); show('#e5', '저장했습니다.', 1); const k = $('#pk').value; const f = await api('listPrompts'); pr.prompts = f.prompts; } catch (e) { show('#e5', e.message); }
  };
  $('#p2').onclick = async () => {
    try { await api('restorePrompt', { key: $('#pk').value }); const f = await api('listPrompts'); pr.prompts = f.prompts; loadP(); show('#e5', '이전 버전으로 되돌렸습니다.', 1); } catch (e) { show('#e5', e.message); }
  };
}

// ── 결과: 1쪽 진단 / 2쪽 처방 ──
async function viewResult(aid) {
  const app = $('#app'); app.innerHTML = '<div class="card">불러오는 중…</div>';
  const { analysis: a, student: stu } = await api('getAnalysis', { analysisId: aid });
  const s = a.scores_json, adv = a.advice_json;
  const areaNames = ['학업역량', '진로적합성', '인성'];
  const bars = [0, 1, 2].map((i) => {
    const cur = s.areaCurrent[i], max = s.areaMax[i];
    const rem = s.items.filter((x) => x.area === i + 1).reduce((t, x) => t + x.remaining, 0);
    return `<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><b>${areaNames[i]}</b><span class="muted">${cur} / ${max} <span>(남은 가능 +${rem})</span></span></div>
      <div class="bar"><i style="width:${Math.max(0, cur / max * 100)}%"></i><i class="r" style="left:${Math.max(0, cur / max * 100)}%;width:${rem / max * 100}%"></i></div></div>`;
  }).join('');
  const prio = s.priorities.slice(0, 6).map((p) => `<tr><td>${p.no}</td><td>${esc(p.title)}</td><td>${p.current}/${p.max}</td><td><b>+${p.remaining}</b></td></tr>`).join('');
  const pen = s.penaltiesAtRisk.map((p) => `<tr><td>${p.no}</td><td>${esc(p.title)}</td><td>${p.current}/${p.max}</td><td>${p.unconfirmed?.length ? '확인 대기: ' + esc(p.unconfirmed.join(', ')) : '감점 발생'}</td></tr>`).join('');
  const cells = s.items.map((i) => `<div class="cell ${i.status}"><span class="muted">${i.no}.</span> ${esc(i.title)}<br><b>${i.current}</b><span class="muted"> / ${i.kind === 'penalty' && i.no === 30 ? '0' : i.max}</span></div>`).join('');
  const g = s.gate;
  const gateHtml = g ? `<div class="gate ${g.status}"><b class="t">① 내신(성취도) 관문 — ${g.status === 'fail' ? '탈락 요건 해당' : g.status === 'warn' ? '주의 (B 2개)' : '현재 통과'}</b>
    <div>${esc(g.message)}</div>
    <div class="muted" style="margin-top:4px">반영 과목 ${g.counted}개 · B ${g.bCount}개 · C 이하 ${g.cCount}개${g.mathSciB?.length ? ' · 수학·과학 B 이하: ' + esc(g.mathSciB.join(', ')) : ''}</div>
    ${g.reasons?.length ? `<ul class="tight">${g.reasons.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
    <div style="margin-top:4px"><b>남은 학기(${esc(g.remainingTerms.join(', '))}) 전 과목 A 유지 필수</b> · 수학·과학 B 1개 불가 · 그 외 B 3개 또는 C 1개 이상도 탈락</div></div>` : '';
  const gapTxt = s.gapToTarget > 0 ? `목표 ${s.targetScore}점까지 <b>${s.gapToTarget}점</b> 부족` : `목표 ${s.targetScore}점 이상`;
  const adviceHtml = adv ? `
    <p>${esc(adv.summary)}</p>
    <h3>항목별 보완 방법</h3>
    ${(adv.itemAdvice || []).map((x) => `<div style="margin:8px 0"><b>${x.no}. ${esc(x.title)}</b><div>${esc(x.advice)}</div>
      ${x.examples?.length ? `<div class="muted">합격자 기록 사례: ${x.examples.map(esc).join(' / ')}</div>` : ''}</div>`).join('')}
    <h3>학기별 실행 계획</h3>
    ${(adv.roadmap || []).map((r) => `<div style="margin:6px 0"><span class="pill">${esc(r.term)}학기</span><ul class="tight">${(r.actions || []).map((t) => `<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')}
    ${adv.penaltyWarnings?.length ? `<h3>감점 주의</h3><ul class="tight">${adv.penaltyWarnings.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}`
    : `<p class="muted">조언을 만들지 못했습니다. <button id="reAdv" class="ghost noprint">다시 만들기</button></p>`;

  app.innerHTML = `
  <div class="row noprint" style="margin-bottom:12px"><a href="#/student/${a.student_id}">← ${esc(stu.name)} 학생</a><span style="flex:1"></span>
    <button class="line" id="orig">원본 PDF 열기</button><button id="pdf">PDF로 저장 / 인쇄</button></div>

  <section class="page">
    <div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="muted">과학고 생기부 진단 · 1쪽 현재 위치</div><h2 style="font-size:22px;margin:2px 0">${esc(stu.name)} <span class="muted" style="font-size:14px">${esc(stu.school)}</span></h2></div>
      <div class="muted">${esc(s.stageLabel)} · ${new Date(a.created_at).toLocaleDateString('ko-KR')}</div></div>
    ${gateHtml}
    <div class="muted" style="margin-top:6px">② 생기부 총점 (내신 관문 통과 후 평가)</div>
    <div class="kpis" style="margin-top:6px">
      <div class="kpi"><span>현재 점수 (400점)</span><b>${s.currentTotal}</b></div>
      <div class="kpi"><span>${gapTxt.replace(/<[^>]+>/g, '')}</span><b>${s.gapToTarget}</b></div>
      <div class="kpi"><span>남은 학기 최대 도달</span><b>${s.bestCaseTotal}</b></div>
      <div class="kpi"><span>최대 도달 시 구간</span><b style="font-size:14px">${esc(s.bestCaseBand)}</b></div>
    </div>
    <h3>영역별 현황</h3>${bars}
    <h3>우선 보완 항목 (남은 점수 큰 순)</h3>
    <table><thead><tr><th>#</th><th>항목</th><th>현재</th><th>더 얻을 수 있는 점수</th></tr></thead><tbody>${prio || '<tr><td colspan=4 class="muted">없음</td></tr>'}</tbody></table>
    <h3>감점형 항목 (지켜야 할 점수)</h3>
    <table><thead><tr><th>#</th><th>항목</th><th>현재</th><th>상태</th></tr></thead><tbody>${pen || '<tr><td colspan=4 class="muted">없음</td></tr>'}</tbody></table>
    <h3>30개 항목 한눈에</h3><div class="cells">${cells}</div>
    <p class="muted" style="margin-top:10px">점수는 3-1학기 기준 400점 체계로 환산한 값입니다. 아직 오지 않은 학기는 반영되지 않았습니다.</p>
  </section>

  <section class="page">
    <div class="muted">과학고 생기부 진단 · 2쪽 처방</div><h2 style="font-size:20px;margin:2px 0 8px">${esc(stu.name)} — 무엇을 어떻게 준비할까</h2>
    ${g ? `<div class="gate ${g.status}"><b>가장 먼저: 남은 학기 전 과목 A 관리</b> — 수학·과학은 B 1개도 안 됩니다. 다른 과목도 B 3개 이상 또는 C 1개 이상이면 1차 서류에서 탈락합니다.</div>` : ''}
    ${adviceHtml}
    <p class="muted" style="margin-top:14px">사례는 서류 합격자 생기부 기록에서 모은 것이며 합격을 보장하지 않습니다.</p>
  </section>`;
  $('#pdf').onclick = () => print();
  $('#orig').onclick = async () => { try { const r = await api('recordUrl', { analysisId: aid }); window.open(r.url, '_blank'); } catch (e) { alert(e.message); } };
  if ($('#reAdv')) $('#reAdv').onclick = async (ev) => { ev.target.disabled = true; ev.target.textContent = '만드는 중…'; try { await api('advise', { analysisId: aid }); viewResult(aid); } catch (e) { alert(e.message); viewResult(aid); } };
}

route().catch((e) => { $('#app').innerHTML = `<div class="card err">${esc(e.message)}</div>`; });
</script>
</body>
</html>
