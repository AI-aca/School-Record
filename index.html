<style>
:root{color-scheme:light;--bg:#f3f6f8;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#e2e8f0;--pri:#00a886;--pri-d:#008f72;--pri2:#e6f7f2;--pri-t:#047857;--ok:#10b981;--warn:#d97706;--bad:#dc2626;--side:#fff;--shadow:0 1px 3px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.05)}
*{box-sizing:border-box}
html{height:100%}body{min-height:100%}
html{overflow-y:scroll}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;font-size:14px;line-height:1.5;display:flex}
#side{width:248px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;flex-shrink:0;position:sticky;top:0;height:100vh}
.logo{padding:0 4px 18px}.slogo{display:block;width:100%;max-width:210px;height:auto;margin:0 0 12px}.lt{line-height:1.3}
.logo b{display:block;font-size:19px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#0891b2,#059669);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo span{font-size:12px;color:var(--sub)}
.reg{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,#06b6d4,#10b981);box-shadow:0 4px 12px rgba(6,182,212,.25);margin-bottom:18px}
.reg:hover{filter:brightness(.95)}
.menu{display:flex;flex-direction:column;gap:4px}
.menu a{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;color:var(--sub);text-decoration:none;font-weight:500;cursor:pointer}
.menu a:hover{background:#f1f5f9;color:var(--ink)}
.menu a.on{background:var(--pri2);color:var(--pri-t);font-weight:700;box-shadow:inset 3px 0 0 var(--pri)}
.menu svg,.reg svg{width:18px;height:18px;flex-shrink:0}
.prof{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#06b6d4,#10b981);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.who b{display:block;font-size:14px}.who span{font-size:12px;color:var(--sub)}
#main{flex:1;min-width:0;padding:26px 36px 48px;overflow-x:clip}
body.out #side{display:none}
body.out #main{max-width:520px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h2{font-size:26px;font-weight:800;margin:0;letter-spacing:-.5px}
.ph p{margin:4px 0 0;color:var(--sub);font-size:13px}
.sn{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sn h2{border:2px solid var(--pri);border-radius:12px;padding:4px 18px;background:#fff}.sn .chip{font-size:14px;padding:5px 13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
h2.t{font-size:16px;margin:0 0 12px}
h2{font-size:17px;margin:0 0 12px}
input,select,textarea{color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--ink);width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(0,168,134,.15)}
.pwm{-webkit-text-security:disc;text-security:disc}
label{font-size:13px;color:var(--sub);display:block;margin:12px 0 5px;font-weight:500}
button{font:inherit;border:0;border-radius:9px;padding:9px 16px;background:var(--pri);color:#fff;cursor:pointer;font-weight:600}
button:hover{background:var(--pri-d)}
button.ghost{background:var(--pri2);color:var(--pri-t)}
button.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
button.line:hover{background:#f1f5f9}
button.line.vw,button.line.fop{background:#e8f1ff;border-color:#b9d3fb;color:#1d4ed8}
button.line.vw:hover,button.line.fop:hover{background:#d6e6ff}
button.line.dx,button.line.dl,button.line.fdl,button.line.xdl{background:#fdecec;border-color:#f5c2c2;color:#b42318}
button.line.dx:hover,button.line.dl:hover,button.line.fdl:hover,button.line.xdl:hover{background:#fbd9d9}
button:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--sub);font-size:13px}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--pri))}
.stat span{font-size:12px;color:var(--sub);font-weight:600}.stat b{display:block;font-size:24px;font-weight:800;margin-top:0}
.bar2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar2 .sr{position:relative;flex:1;min-width:200px;max-width:340px}

// ── 화면 전환 ──
async function route() {
  document.body.classList.toggle('out', !token);
  $('#who').textContent = role === 'director' ? '관리자' : role ? '강사' : '';
  $('#av').textContent = role === 'director' ? '관' : '강';
  $('#m-set').classList.toggle('hidden', !(token && role === 'director'));
  if (!token) return viewLogin();
  const h = location.hash;
  $('#m-bulk').classList.toggle('hidden', !(token && role === 'director'));
  $('#m-bulk').classList.toggle('on', h === '#/bulk' || h === '#/diag');
  $('#m-ex').classList.toggle('hidden', !(token && role === 'director'));
  $('#m-ex').classList.toggle('on', h === '#/exemplars');
  $('#m-home').classList.toggle('on', !h.startsWith('#/settings') && h !== '#/new' && h !== '#/guide' && h !== '#/bulk' && h !== '#/diag' && h !== '#/exemplars');
  $('#m-guide').classList.toggle('on', h === '#/guide');
  $('#m-set').classList.toggle('on', h === '#/settings');
  if (h === '#/new') return viewNew();
  if (h === '#/guide') return viewGuide();
  if (h === '#/bulk') return role === 'director' ? viewBulkHub('up') : viewList();
  if (h === '#/diag') return role === 'director' ? viewBulkHub('diag') : viewList();
  if (h === '#/exemplars') return role === 'director' ? viewEx() : viewList();
  if (h === '#/settings') return role === 'director' ? viewSettings() : viewList();
  if (h.startsWith('#/student/')) return viewStudent(h.split('/')[2]);
  if (h.startsWith('#/result/')) { const m = h.split('/')[3]; return viewResult(h.split('/')[2], m === 'admin' && role === 'director' ? 'admin' : m === 'teacher' ? 'teacher' : 'parent'); }
  return viewList();
}
$('#regbtn').onclick = () => (location.hash = '#/new');
window.onhashchange = route;

const SORT = { k: '', d: 1 };
async function viewList() {

  let flash = ''; try { flash = sessionStorage.getItem('sr_flash') || ''; if (flash) sessionStorage.removeItem('sr_flash'); } catch (_) {}
  app.innerHTML = head('초기 화면 (대시보드)', '과학고 지원 학생의 생기부 진단 현황', '') + (flash ? `<div class="flash">${esc(flash)}</div>` : '') + `
  <div class="stats">
    <div class="stat"><span>전체 학생</span><b>${students.length}</b></div>
    <div class="stat" style="--c:#06b6d4"><span>진단 완료</span><b>${done.length}</b></div>
    <div class="stat" style="--c:#10b981"><span>목표 ${target}점 이상</span><b>${ok.length}</b></div>
    <div class="stat" style="--c:#f59e0b"><span>내신 주의·위기</span><b>${bad.length}</b></div>
  </div>
  <div class="bar2">
    <div class="sr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="q" placeholder="학생명 또는 학교 검색"></div>
    <select id="fc"><option value="">센터 전체</option>${centers.map((c) => `<option>${esc(c)}</option>`).join('')}</select>
    <select id="fg"><option value="">내신 관문 전체</option><option value="pass">통과</option><option value="warn">주의</option><option value="fail">위기</option><option value="none">진단 전</option></select>
    <select id="fs"><option value="">반영 학기 전체</option><option value="A">1-2까지</option><option value="B">2-1까지</option><option value="C">2-2까지</option><option value="none">진단 전</option></select>
  </div>
  <div class="tw dash"><table class="ct"><thead><tr><th class="sk" data-k="c">센터<i></i></th><th class="sk" data-k="n">학생명<i></i></th><th class="sk" data-k="s">학교<i></i></th><th class="sk" data-k="t">반영 학기<i></i></th><th class="sk" data-k="p">점수<i></i></th><th class="sk" data-k="g">내신 관문<i></i></th><th class="sk" data-k="d">진단일<i></i></th><th style="text-align:center">학부모용</th><th style="text-align:center">교사용</th><th style="text-align:center">업로드/이력</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const draw = () => {
    const q = $('#q').value.trim(), fc = $('#fc').value, fg = $('#fg').value, fs = $('#fs').value;
    const rows = students.filter((x) => (!q || (x.name + (x.school || '') + sch(x.school)).includes(q)) && (!fc || x.center_name === fc) && (!fg || (fg === 'none' ? !x.last : x.last?.gate === fg)) && (!fs || (fs === 'none' ? !x.last : x.last?.stage === fs)));
    const ord = { fail: 0, warn: 1, pass: 2 }, ko = (a, b) => String(a || '').localeCompare(String(b || ''), 'ko');
    const val = { c: (x) => x.center_name || '', n: (x) => x.name, s: (x) => sch(x.school), t: (x) => (x.last ? { A: 1, B: 2, C: 3 }[x.last.stage] : null), p: (x) => (x.last ? x.last.total ?? null : null), g: (x) => (x.last?.gate ? ord[x.last.gate] ?? 3 : null), d: (x) => (x.last ? new Date(x.last.created_at).getTime() : null) };
    if (SORT.k) rows.sort((a, b) => { const va = val[SORT.k](a), vb = val[SORT.k](b); if (va == null || vb == null) return va == null && vb == null ? 0 : va == null ? 1 : -1; const r = typeof va === 'string' ? ko(va, vb) : va - vb; return SORT.d * r; });
    app.querySelectorAll('th.sk').forEach((th) => { th.querySelector('i').textContent = th.dataset.k === SORT.k ? (SORT.d > 0 ? ' ▲' : ' ▼') : ''; });
    $('#tb').innerHTML = rows.map((x) => `<tr class="click" data-id="${x.id}"><td>${esc(x.center_name)}</td><td><span class="chip">${esc(x.name)}</span></td><td>${esc(sch(x.school))}</td>
      <td>${x.last ? `<span class="pill">${TERM_UP[x.last.stage]}</span>` : '<span class="muted">-</span>'}</td>
      <td>${x.last ? `<span class="sc" style="color:${x.last.total >= target ? '#059669' : '#0f172a'}">${x.last.total ?? ''}</span>` : '<span class="muted">-</span>'}</td>
      <td>${x.last?.gate ? `<span class="pill ${x.last.gate}">${GATE_LABEL[x.last.gate]}</span>` : '<span class="pill none">진단 전</span>'}</td>
      <td class="muted">${x.last ? new Date(x.last.created_at).toLocaleDateString('ko-KR') : '미진단'}</td><td style="text-align:center">${x.last ? `<span class="btn-s rep" data-aid="${x.last.id}" data-m="parent">학부모용 열기</span>` : '<span class="muted">-</span>'}</td><td style="text-align:center">${x.last ? `<span class="btn-s rep" data-aid="${x.last.id}" data-m="teacher" style="background:#2563eb">교사용 열기</span>` : '<span class="muted">-</span>'}</td><td style="text-align:center"><span class="btn-s" style="background:#64748b">열기</span></td></tr>`).join('') || '<tr><td colspan=10 class="muted" style="text-align:center;padding:28px">조건에 맞는 학생이 없습니다. 왼쪽 위 [학생 등록]으로 추가하세요.</td></tr>';
    app.querySelectorAll('tr.click').forEach((tr) => tr.onclick = () => (location.hash = '#/student/' + tr.dataset.id));
    app.querySelectorAll('.rep').forEach((b) => b.onclick = (e) => { e.stopPropagation(); location.hash = '#/result/' + b.dataset.aid + '/' + b.dataset.m; });
  };
  app.querySelectorAll('th.sk').forEach((th) => (th.onclick = () => { if (SORT.k === th.dataset.k) SORT.d = -SORT.d; else { SORT.k = th.dataset.k; SORT.d = 1; } draw(); }));
  ['q', 'fc', 'fg', 'fs'].forEach((i) => ($('#' + i).oninput = draw)); draw();
}

// ── 학생 등록(여러 명) ──
async function viewNew() {
  const app = $('#main'); const { centers } = await api('getSettings');
  const opts = (first) => `<option value="">${first}</option>${centers.map((c) => `<option>${esc(c)}</option>`).join('')}`;
  const rowHtml = () => `<tr class="nr"><td><input class="rn" placeholder="이름"></td><td><input class="rsc" placeholder="학교"></td><td><select class="rce">${opts('기본 센터')}</select></td><td class="re" style="color:#dc2626;font-size:13px;min-width:90px"></td><td><button class="line rx" title="이 줄 삭제" style="padding:6px 10px">✕</button></td></tr>`;
  app.innerHTML = head('학생 등록', '한 명이든 여러 명이든 아래 표에 입력하고 한 번에 등록합니다. 등록 후 초기 화면으로 이동합니다.') + `
  <div class="card" style="max-width:820px">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><b>기본 센터 *</b><select id="dce" style="max-width:220px">${opts('선택')}</select><span class="muted" style="font-size:13px">줄마다 센터를 따로 고르지 않으면 이 센터로 등록됩니다.</span></div>
    <table id="nt" style="font-size:14px"><thead><tr><th style="text-align:left;width:26%">이름 *</th><th style="text-align:left;width:34%">학교</th><th style="text-align:left;width:24%">센터</th><th></th><th></th></tr></thead><tbody id="ntb">${rowHtml().repeat(3)}</tbody></table>
    <div class="row" style="margin-top:10px"><button class="line" id="addrow">+ 줄 추가</button><button class="line" id="addrow5">+ 5줄 추가</button></div>
    <div class="err" id="e" style="margin-top:8px"></div>
    <div class="row" style="margin-top:14px"><button id="add">등록</button><button class="line" id="cx">취소</button></div></div>`;
  const tb = $('#ntb');
  const bindRx = () => tb.querySelectorAll('.rx').forEach((b) => b.onclick = () => { if (tb.querySelectorAll('tr.nr').length > 1) b.closest('tr').remove(); else { b.closest('tr').querySelectorAll('input').forEach((i) => (i.value = '')); } });
  const addRows = (n) => { tb.insertAdjacentHTML('beforeend', rowHtml().repeat(n)); bindRx(); };
  bindRx();
  $('#addrow').onclick = () => addRows(1); $('#addrow5').onclick = () => addRows(5);
  $('#cx').onclick = () => (location.hash = '#/');
  $('#add').onclick = async () => {
    const e = $('#e'); e.textContent = ''; const btn = $('#add');
    const rows = [...tb.querySelectorAll('tr.nr')].map((tr) => ({ tr, name: tr.querySelector('.rn').value.trim(), school: sch(tr.querySelector('.rsc').value), center: tr.querySelector('.rce').value || $('#dce').value })).filter((x) => x.name);
    tb.querySelectorAll('.re').forEach((c) => (c.textContent = ''));
    if (!rows.length) { e.textContent = '이름을 한 명 이상 입력하세요.'; return; }
    let bad = false; rows.forEach((x) => { if (!x.center) { x.tr.querySelector('.re').textContent = '센터 선택'; bad = true; } });
    if (bad) { e.textContent = '센터가 없는 줄이 있습니다. 위의 기본 센터를 고르거나 줄마다 센터를 선택하세요.'; return; }
    btn.disabled = true; btn.textContent = '등록 중…';
    let exist = new Set();
    try { const { students } = await api('listStudents'); exist = new Set(students.map((s) => [s.name, sch(s.school), s.center_name || ''].join('|'))); } catch (_) {}
    let ok = 0, fail = 0;
    for (const x of rows) {
      const key = [x.name, x.school, x.center].join('|'), cell = x.tr.querySelector('.re');
      if (exist.has(key)) { cell.textContent = '이미 등록됨'; fail++; continue; }
      try { await api('addStudent', { name: x.name, school: x.school, center_name: x.center }); exist.add(key); ok++; x.tr.remove(); }
      catch (er) { cell.textContent = er.message || '실패'; fail++; }
    }
    btn.disabled = false; btn.textContent = '등록';
    if (!fail) { try { sessionStorage.setItem('sr_flash', ok + '명을 등록했습니다.'); } catch (_) {} location.hash = '#/'; return; }
    e.textContent = ok + '명을 등록했습니다. 표에 남은 ' + fail + '줄은 등록되지 않았습니다(오른쪽 사유 확인).';
    if (!tb.querySelectorAll('tr.nr').length) addRows(1);
  };
}

const loadScript = (src) => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('PDF 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.')); document.head.appendChild(s); });
async function downloadPdf(btn, name) {

    if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    let css = '';
    for (const sh of document.styleSheets) for (const r of sh.cssRules) {
      if (r.type !== CSSRule.MEDIA_RULE || !/print/.test(r.media.mediaText)) continue;
      for (const q of r.cssRules) {
        if (q.type !== CSSRule.STYLE_RULE) continue;
        const sel = q.selectorText.split(',').map((x) => x.trim()).filter((x) => x && !/^(body|#side|\.noprint|#main|\*)/.test(x)).map((x) => '.pdfmode ' + x).join(',');
        if (sel) css += sel + '{' + q.style.cssText + '}';
      }
    }
    st = document.createElement('style'); st.textContent = css + '.pdfmode .trk i.b{background:#c6eedd}.pdfmode .sec{letter-spacing:.4px}'; document.head.appendChild(st);
    wrap = document.createElement('div'); wrap.className = 'pdfmode'; wrap.style.cssText = 'position:absolute;left:-10000px;top:0;width:726px;background:#fff';
    const secs = [...document.querySelectorAll('section.page')].map((s) => wrap.appendChild(s.cloneNode(true)));
    wrap.querySelectorAll('.ring svg').forEach((sv) => { sv.style.transform = 'none'; const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.setAttribute('transform', 'rotate(-90 94 94)'); [...sv.childNodes].forEach((x) => g.appendChild(x)); sv.appendChild(g); });
    wrap.querySelectorAll('.sec').forEach((e) => { const t = e.firstChild; if (t && t.nodeType === 3) t.textContent = t.textContent.replace(/^([①-⑥])\s*/, '$1\u2003'); });
    document.body.appendChild(wrap);
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const PW = 726, H = Math.floor(PW * 271 / 184);
    const ATOM = '.adv,.rt,.ac,.cell,.gate,.sum,.hero,.ar,.lg2,.sub,.pf,.sec,.rh,.rs,li,h2,h3,p';
    const collect = (el, out) => { for (const c of el.children) { if (c.matches(ATOM) || !c.children.length) out.push(c); else collect(c, out); } };
    const { jsPDF } = window.jspdf; const pdf = new jsPDF({ unit: 'mm', format: 'a4' }); let n = 0;
    for (const sec of secs) {
      const base = sec.getBoundingClientRect().top, total = sec.getBoundingClientRect().height;
      const atoms = []; collect(sec, atoms);
      const T = atoms.filter((a) => !a.matches('.pf')).map((a) => { const r = a.getBoundingClientRect(); return { t: r.top - base, h: a.matches('.sec,.sub') }; });
      const cuts = [0]; let y0 = 0;
      while (total - y0 > H + 30) {
        let cand = -1; for (let i = 0; i < T.length; i++) if (T[i].t > y0 + 4 && T[i].t <= y0 + H) cand = i;
        let c = y0 + H;
        if (cand >= 0) { let i = cand; while (i > 0 && T[i - 1].h && T[i - 1].t > y0 + 4) i--; c = T[i].t; }
        cuts.push(c); y0 = c;
      }
      cuts.push(total);
      const canvas = await html2canvas(sec, { scale: 3, backgroundColor: '#ffffff', useCORS: true, logging: false });
      const k = canvas.width / PW;
      for (let i = 0; i < cuts.length - 1; i++) {
        const sy = Math.round(cuts[i] * k), sh = Math.max(1, Math.round((cuts[i + 1] - cuts[i]) * k));
        const c2 = document.createElement('canvas'); c2.width = canvas.width; c2.height = sh;
        const g = c2.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c2.width, sh); g.drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);
        if (n++) pdf.addPage();
        pdf.addImage(c2.toDataURL('image/jpeg', 0.92), 'JPEG', 13, 14, 184, (cuts[i + 1] - cuts[i]) * 184 / PW);
      }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(pdf.output('blob')); a.download = (name || '학생') + '.pdf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { uiAlert(e.message || 'PDF를 만들지 못했습니다. 인쇄 버튼으로 PDF 저장을 이용해 주세요.'); }
  finally { if (wrap) wrap.remove(); if (st) st.remove(); btn.disabled = false; btn.textContent = label; }
}

// ── 항목 카드 → 합격자 근거 팝업 (교사용·관리자용) ──
const XCAT = { 4: 'clubs', 5: 'all_awards', 6: 'sci_awards', 7: 'math_research', 8: 'sci_research', 9: 'books_mathsci', 10: 'seteuk_deep', 11: 'seteuk_deep', 12: 'behavior_gifted', 13: 'career', 14: 'interest_activity', 15: 'teacher_top_rec', 16: 'teacher_top_rec', 17: 'teacher_top_rec', 18: 'study_proactive', 19: 'group_debate', 20: 'group_debate', 21: 'help_share', 22: 'leadership_roles', 23: 'rule_comply', 25: 'books_general', 28: 'leadership_roles', 29: 'peer_good' };
const xClean = (t) => String(t || '').replace(/\s*[(（\[][^)）\]]*\d{4}\s*[.\-\/년]\s*\d{1,2}[^)）\]]*[)）\]]/g, '').replace(/\d{4}\s*[.\-\/]\s*\d{1,2}\s*[.\-\/]\s*\d{1,2}\.?/g, '').replace(/\s{2,}/g, ' ').replace(/\s+([,.])/g, '$1').trim();
let XLIST = null;
async function xShow(no, title) {
  const cat = XCAT[no]; if (!cat) return;
  if (!XLIST) { try { XLIST = (typeof EX !== 'undefined' && EX.loaded && EX.saved.length) ? EX.saved : (await api('listExemplars')).items; } catch (e) { return uiAlert(e.message); } }
  const pool = [...new Set(XLIST.filter((x) => x.category === cat).map((x) => xClean(x.content)).filter(Boolean))];
  const isName = CAT_NAME.includes(cat);
  const pick = () => pool.map((v) => [Math.random(), v]).sort((a, b) => a[0] - b[0]).slice(0, 7).map((x) => x[1]);
  const m = document.createElement('div'); m.className = 'xmod';
  const draw = () => { m.innerHTML = `<div class="xbox"><div class="xh"><b>${esc(no + '. ' + title)} · 합격자 근거</b><button class="xx" aria-label="닫기">✕</button></div><div class="xb">${pool.length ? `<div class="xq"><ul>${pick().map((v) => `<li>${esc(v)}</li>`).join('')}</ul></div>` : '<p class="muted">이 항목에 저장된 합격 사례가 아직 없습니다.</p>'}</div><div class="xf"><span>${esc(CAT_KO[cat] || cat)} · 저장된 합격 사례 중 무작위${isName ? ' (이름)' : ''}</span>${pool.length > 7 ? '<button class="btn xn">다른 사례 보기</button>' : ''}</div></div>`; m.querySelector('.xx').onclick = close; const n = m.querySelector('.xn'); if (n) n.onclick = draw; };
  const close = () => { m.remove(); document.removeEventListener('keydown', esck); };
  const esck = (e) => { if (e.key === 'Escape') close(); };
  m.onclick = (e) => { if (e.target === m) close(); };
  document.addEventListener('keydown', esck); draw(); document.body.appendChild(m);
}

  <div class="tabs noprint"><a data-m="parent" class="${par ? 'on' : ''}">학부모용</a><a data-m="teacher" class="${mode === 'teacher' ? 'on' : ''}">교사용</a><a data-m="admin" class="${adm ? 'on' : ''}">관리자용</a></div>
  ${adm ? '<div class="admwarn">관리자 전용 보기 · 항목별 점수·배점 포함 · 학부모에게 제공하지 마세요</div>' : mode === 'teacher' ? '<div class="admwarn">교사용 보기 · 인쇄·PDF 불가 · 학부모에게 제공하지 마세요</div>' : ''}
  ${par ? '' : '<style>@media print{.page,.admwarn{display:none!important}.pnote{display:block!important}}</style><div class="pnote" style="display:none;font-size:18px;padding:40px">교사용·관리자용 화면은 인쇄할 수 없습니다. 학부모용 탭에서 인쇄해 주세요.</div>'}

  <section class="page">
    ${head3()}
    <div class="rs"><h2>${esc(stu.name)}</h2><div class="meta"><span class="pill none">${esc(sch(stu.school) || '학교 미입력')}</span><span class="pill none">${esc(stu.center_name || '')}</span><span class="pill">반영 학기 ${TERM_UP[a.stage]}</span></div></div>
    ${g ? '<div class="sec" style="margin-top:4px">① 내신(성취도) 관문</div>' : ''}
    ${gateHtml}
    <div class="sec">② 생기부 총점 <small>내신 관문 통과 후 평가</small></div>
    ${hero}
    <div class="sec">③ 영역별 현황</div>
    <div class="lg2"><span><i style="background:linear-gradient(90deg,#06b6d4,#10b981)"></i>현재 점수</span><span><i style="background:repeating-linear-gradient(135deg,#a7e8d3 0 3px,#d1f4e7 3px 6px)"></i>남은 학기에 더 얻을 수 있는 점수</span><span><i style="background:#e8eef3"></i>올리기 어려운 부분</span></div>
    ${rows.map((r) => bar(r)).join('')}
    ${bar({ name: '전체 합계', cur: s.currentTotal, max: 400, rem: s.bestCaseTotal - s.currentTotal }, true)}
    ${foot(1)}
  </section>

  ${par ? '' : `  <section class="page">
    ${head3()}
    <div class="sec" style="margin-top:4px">④ 30개 항목 한눈에</div>
    <div class="lg2"><span><i style="background:#ecfdf3;border-color:#86efac"></i>만점</span><span><i style="background:#fff8eb;border-color:#fcd34d"></i>보완하면 더 얻을 수 있음</span><span><i style="background:#eef2ff;border-color:#a5b4fc"></i>감점형(현재 감점 없음)</span><span><i style="background:#fef2f2;border-color:#fca5a5"></i>감점 발생</span><span><i style="background:#f8fafc"></i>더 올릴 수 없음</span></div>
    ${grp}
    ${foot(2)}
  </section>`}

  <section class="page">
    ${head3()}
    <div class="sec" style="margin-top:4px">${par ? '④' : '⑤'} 종합 의견</div>
    ${adviceItems}
    ${adm && adv && (adv.exampleShortage || []).length ? `<p class="muted" style="font-size:12.5px;margin-top:8px"><b>사례 부족 분류(관리자 전용):</b> ${adv.exampleShortage.map((x) => `${esc(x.label)} ${x.have}/${x.need}건`).join(' · ')} — 합격 사례를 더 추출하면 채워집니다.</p>` : ''}
    ${foot(3)}
  </section>

  ${rmPages}`;
  if (!par) app.querySelectorAll('.cell.xp').forEach((c) => (c.onclick = () => xShow(+c.dataset.no, (c.querySelector('.ct').textContent.replace(/^\d+\.\s*/, '').replace(/\s*▸$/, '')))));
  app.querySelectorAll('.tabs a').forEach((t) => t.onclick = () => { if (t.dataset.m === 'admin' && role !== 'director') return uiAlert('관리자에게 문의하세요.'); location.hash = '#/result/' + aid + '/' + t.dataset.m; });
  const ask = async (act) => await uiConfirm(`${par ? '학부모용' : '교사용'} 진단지입니다. ${act}하시겠습니까?` + (par ? '' : '\n(교사용은 학부모에게 제공하지 마세요.)'));
  if ($('#pdf')) $('#pdf').onclick = async () => { if (!await ask('인쇄')) return; const ot = document.title; document.title = fname; window.onafterprint = () => { document.title = ot; window.onafterprint = null; }; print(); };
  if ($('#pdfdl')) $('#pdfdl').onclick = async (ev) => { if (await ask('PDF 다운로드')) downloadPdf(ev.target, fname); };
  $('#orig').onclick = async () => { try { const r = await api('recordUrl', { analysisId: aid }); window.open(r.url, '_blank'); } catch (e) { uiAlert(e.message); } };
  const reAdv = async (btn) => { if (role !== 'director') return uiAlert('관리자에게 문의하세요.'); btn.disabled = true; btn.textContent = '만드는 중… (몇 분 걸릴 수 있습니다)'; try { await apiJob('advise', { analysisId: aid }); viewResult(aid); } catch (e) { uiAlert(e.message); viewResult(aid); } };
  if ($('#reAdv')) $('#reAdv').onclick = (ev) => reAdv(ev.target);
  if ($('#reAdv2')) $('#reAdv2').onclick = async (ev) => { if (role !== 'director') return uiAlert('관리자에게 문의하세요.'); if (await uiConfirm('조언(보완 방법·실행 계획)만 새로 만듭니다. 점수는 바뀌지 않습니다.')) reAdv(ev.target); };
}

route().catch((e) => { $('#main').innerHTML = `<div class="card err">${esc(e.message)}</div>`; });
</script>
</body>
</html>
